# ipsec.conf - strongSwan IPsec configuration file

# basic configuration

config setup

conn myvpn
  keyexchange=ikev1
  left=%defaultroute
  auto=start
  rightauth=psk
  leftauth=psk
  type=transport
  leftprotoport=17/1701
  rightprotoport=17/1701
  right=12.12.1.168
  ike=3des-sha1-modp1024
  esp=3des-sha1

