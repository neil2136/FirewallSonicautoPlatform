
ddns-update-style interim;
ignore client-updates;

shared-network Inside {
subnet 172.16.1.0 netmask 255.255.255.0 {
    interface eth1;
    range dynamic-bootp 172.16.1.5 172.16.1.120;
    option routers 172.16.1.101;
    option subnet-mask 255.255.255.0;
    option time-offset -18000;
    default-lease-time 21600;
    max-lease-time 43200;
}
}
shared-network Inside10{
subnet 12.12.2.0 netmask 255.255.255.0 {
    interface eth1;
    range dynamic-bootp 12.12.2.5 12.12.2.120;
    option routers 12.12.2.201;
    option subnet-mask 255.255.255.0;
    option time-offset -18000;
    default-lease-time 21600;
    max-lease-time 43200;
}
}

