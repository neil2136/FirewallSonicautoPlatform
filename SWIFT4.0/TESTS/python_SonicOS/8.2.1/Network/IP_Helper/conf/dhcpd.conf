ddns-update-style interim;
ignore client-updates;

default-lease-time 30;
max-lease-time 60;

shared-network Inside {
subnet 2.2.2.22 netmask 255.255.255.255 {
#range 10.10.10.128 10.10.10.254;
#option routers 10.10.10.1;
}
subnet 3.3.3.0 netmask 255.255.255.0 {
range 3.3.3.10 3.3.3.12;
#option routers 3.3.3.100;
}
subnet 192.168.168.0 netmask 255.255.255.0 {
range 192.168.168.20 192.168.168.22;
#option routers 192.168.168.168;
}

}
