ddns-update-style interim;
ignore client-updates;

subnet 172.17.1.0 netmask 255.255.255.0 {
    interface eth1;
    range dynamic-bootp 172.17.1.100 172.17.1.120;
    option routers 172.17.1.1;
    option subnet-mask 255.255.255.0;
    option time-offset -18000;
    default-lease-time 21600;
    max-lease-time 43200;
}
subnet 172.18.1.0 netmask 255.255.255.0 {
    interface eth4;
    range dynamic-bootp 172.18.1.100 172.18.1.120;
    option routers 172.18.1.20;
    option subnet-mask 255.255.255.0;
    option time-offset -18000;
    default-lease-time 21600;
    max-lease-time 43200;
}
