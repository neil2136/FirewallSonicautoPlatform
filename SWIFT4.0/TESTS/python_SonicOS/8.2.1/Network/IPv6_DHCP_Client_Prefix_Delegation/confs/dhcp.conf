# testvar virtualUdpServiceLanPort3 161



# ------------------------------------------------------------------------------
#
# SECTION: PORT SCANNING AND DoS RELATED SETUP
#
# ------------------------------------------------------------------------------

# The range of ports which should be scanned during the firewall test modules.
#
testvar portScanStart         0
testvar portScanStop          2048

# By default, CDRouter will only wait 1 millisecond between each scan probe. 
# This delay can be increased by setting the testvar portScanDelay to a higher 
# number. This will slow down the rate at which CDRouter sends scan probe 
# packets.
#
testvar portScanDelay         1

# If the DUT is expected to close specific ports on the WAN, you may configure 
# a list of closed ports. These ports will be verified during the port 
# scanning tests. Some routers offer this service on port 113 and others.
#
# You may also configure a list of open ports on the DUT. If the port is being 
# used for a virtual service, then the port should not be configured as an open
# port.
#
# testvar firewallTcpOpenPorts  "22 443"
# testvar firewallTcpClosedPorts 2323
#
# testvar firewallUdpOpenPorts  1234
# testvar firewallUdpClosedPorts 113
#


#
# -- Denial of Service Configuration Options
#

# testvar dosRecoveryTime       5
# testvar dosAttackAttempts     100
# testvar dutMgmtPort           80
# testvar dosSynAttackPort      80



# ------------------------------------------------------------------------------
#
# SECTION: NAT SETUP
#
# ------------------------------------------------------------------------------

# If the NAT/firewall configuration supports simultaneous TCP open, configure 
# the testvar natSimulataneousTcp to "yes". Otherwise, configure this to "no".
#
testvar natSimultaneousTcp    no

# If the NAT implementation allows src port 0, configure the testvar
# natSrcPort0 to "yes". Otherwise, configure this to "no".
#
testvar natSrcPort0           yes

# If the NAT implementation is Peer-to-Peer friendly (P2P), configure the 
# testvar natSupportsP2P to "yes". Otherwise, configure this to "no". When set 
# to yes, the NAT module will include tests for Cone NAT and hairpin media 
# translation.
#
testvar natSupportsP2P        yes

# If the NAT implementation preserves the port parity (odd or even), configure 
# the testvar natPortParity to "yes". Otherwise, configure this to "no". If the 
# testvar is set to "no", the NAT port parity test will be skipped.
#
testvar natPortParity         yes

# The NAPT mode. This specifies the type of NAT implemented by the router.
#
#   Valid options are:
#
#    address-restricted
#    port-restricted
#    full-cone
#
testvar natMode               address-restricted

# NAT timers. The Fin/Rst timeout for TCP sessions can be configured using the 
# natFinRstTimeout testvar. If not specified, the NAT Fin/Rst related tests will
# be skipped. This timer is normally implementation dependent although RFC 2663 
# recommends a default of 240 seconds (4 minutes).
#
# testvar natFinRstTimeout    240
#
# testvar natTcpTimeout       86400
# 
# testvar natSynTimeout       90
#
# testvar natUdpTimeout       300
#
# testvar natDnsTimeout       300
#
# testvar natIcmpTimeout      120
#
# Depending on the implementation, the testvar natLagTime can also be 
# configured. This is used for implementations that only support NAT timeouts 
# with a granulation greater than 1 second. This testvar represents how often 
# the NAT timers are checked (in seconds). For example, if the NAT timers are 
# only checked once per minute, the testvar natLagTime should be set to 60.
#
# testvar natLagTime 60
#

# Xbox Live NAT testing allows you set the minimum type of NAT that is allowed. 
# NAT types are open, moderate, and restricted.
#
# testvar xboxNatMinType open
# 

# The maximum number of TCP connections created per DHCP client during the 
# scaling tests
#
testvar scaleTcpConnsPerHost  5

# Normally, CDRouter will select a new starting TCP/UDP port for TCP/UDP clients
# when the test run starts. However, it is possible to force a specific starting
# port for test purposes. The starting port number must be an integer from 1 to 
# 65535.
#
# testvar tcpUdpPortStart 10000
#



# ------------------------------------------------------------------------------
#
# SECTION: UPnP SETUP
#
# ------------------------------------------------------------------------------

# If the DUT supports UPnP, set this testvar to 'yes' to enable UPnP within
# CDRouter.
#
testvar upnpSupported         yes

# If the DUT uses the WANPPPConnection service instead of the WANIPConnection 
# service, configure the upnpWANPPPConnnection testvar
# to' yes'.
#
# testvar upnpWANPPPConnection  no

# If the DUT supports the LANDevice service template, configure the
# upnpLANDevice testvar to 'yes'.
#
testvar upnpLANDevice         no

# The maximum number of UPnP port mappings to test
#
testvar upnpMaxTcpMappings    10

# The maximum number of UPnP event subscriptions to test
#
testvar upnpMaxSubClients     10

# The minimum supported UPnP event subscription timeout
#
testvar upnpMinSubTimeout     40

# The maximum supported UPnP event subscription timeout
#
testvar upnpMaxSubTimeout     3600

# The maximum time it takes UPnP to detect that the WAN link is down. For PPP 
# based protocols, CDRouter will bring the link down automatically using a PADT 
# or PPP LCP Terminate. The upnpWANFailureTimeout value is an additional time to
# wait before the link is considered down. Normally, the UPnP router will send a
# NOTIFY message during this time since the ConnectionStatus should change. For 
# DHCP, this time value is additional time to wait for a NOTIFY after the DHCP 
# lease has expired.
#
testvar upnpWANFailureTimeout 120

# The port ranges that will be used for all UPnP tests. This port range should 
# not conflict with any other static port mappings on the router such as virtual
# services or port triggers. The range should contain at least the maximum 
# number of ports that are supported with the upnpMaxTcpMappings configured 
# above.
#
testvar upnpPortStart         40000
testvar upnpPortStop          50000



# ------------------------------------------------------------------------------
#
# SECTION: DMZ SETUP
#
# ------------------------------------------------------------------------------

# A DMZ host on the LAN side of the router can be configured using the 
# lanDmzHost entry below. If the router does not have a DMZ host configured, no 
# lanDmzHost entry should be configured. When the DMZ host is configured, the 
# firewall tests will no longer run.
#
# testvar lanDmzHost            192.168.1.253
#

# An optional MAC address may be defined for the DMZ host. If not defined, a 
# default MAC address is assigned.
#
# testvar lanDmzHostMac         00:00:23:01:02:03
#

# You can configure exceptions for certain TCP or UDP ports and IP protocols
# that do not have DMZ behavior. These routers may have been configured to 
# reject or drop certain ports regardless of the DMZ configuration. Each 
# exception testvar takes a comma separated list of values.
# 
# testvar lanDmzTcpPortExceptions 113
# testvar lanDmzUdpPortExceptions 1234
# testvar lanDmzIpProtoExceptions "2,47"
#

# If the router does not support ICMP packets getting forwarded to the DMZ host,
# the lanDmzSupportsIcmp option can be set to no. Otherwise, it defaults to yes.
#
testvar lanDmzSupportsIcmp    no



# ------------------------------------------------------------------------------
#
# SECTION: MULTICAST SETUP
#
# ------------------------------------------------------------------------------

# If the DUT supports multicast forwarding or proxy functionality, set this
# testvar to 'yes' to enable multicast support within CDRouter.
#
testvar supportsMulticast     yes

# The multicastType testvar can be used to select the type of multicast
# implementation supported by the DUT. This should be either:
#
# proxy
# passthrough
#
testvar multicastType         proxy

# Some CPE devices can only receive multicast on the LAN and can not forward 
# multicast outbound through NAT over the WAN interface. If the device does not 
# support outbound multicast, the testvar supportsMultiCastOut can be configured
# to no. The default is yes.
#
# testvar supportsMulticastOut no
#

# The IGMP version for all LAN clients and the WAN side IGMP behavior can be 
# configured using the testvar igmpVersion. The default IGMP version is 2. 
# Version 3 may also be configured.
#
# For IGMPv2:
# testvar igmpVersion 2
#
# For IGMPv3:
# testvar igmpVersion 3
#

# By default, the IGMPv2 and greater client will send IGMP packets with the IP 
# Router Alert IP Option. This may be disabled by configuring the 
# igmpRouterOption testvar to no.
#
testvar igmpRouterOption      yes

# The maximum number of IGMP groups that are supported on the LAN interface
#
testvar igmpMaxGroups         64

# The multicast cache timeout is used to specify a delay after a host leaves a 
# group before forwarding should stop. Some devices implement a cache function 
# that allows packets to be forwarded for a few seconds after the last host 
# leaves a multicast group.
#
testvar multicastCacheTimeout 10

# Free multicast addresses to use for multicast testing
#
testvar multicastPoolStart    224.0.1.0
testvar multicastPoolStop     239.255.255.255


#
# -- IGMP Timers
#

# RFC 2236 and RFC 3376 define the following parameters for IGMP 
# implementations:
#
# testvar igmpQueryInterval          125
# testvar igmpRobustnessVariable     2
# testvar igmpQueryResponseInterval  10 
#


#
# -- IGMP Fast Leave
#

# When IGMP Fast Leave is enabled, no group specific IGMP query is sent when a 
# host leaves a group and its the only host on a port. Normally, IGMP Fast leave
# is used when IGMP Snooping is also enabled.
#
# testvar igmpFastLeave no
#


#
# -- IPTV Configuration Options
#

# The multicast test module contains IPTV specific channel change tests. There 
# are a few configuration options available:
#
# The number of channels to change:
#
# testvar iptvChannelRange 200
#
# The amount of delay in milliseconds between each channel change:
#
# testvar iptvChannelChangeDelay 200
#
# Stop the channel change test after a specific number of failures:
#
# testvar iptvMaxFailures 10
#



# ------------------------------------------------------------------------------
#
# SECTION: IPSEC/IKE SETUP
#
# ------------------------------------------------------------------------------

# Multiple IPSEC tunnels can be defined to correspond with IPSEC tunnels that 
# have been created on the device under test. There are several testvar
# variables that must be configured for each tunnel. Each entry ends with the 
# tunnel number such as 1, 2, 3, etc. If you have CDRouter IKE, the tunnels may 
# be dynamic using IKE. Otherwise, the tunnels are manual keys only. More 
# details on configuring dynamic tunnels with IKE can be found in the CDRouter
# IKE User Guide.
#
# ipsecTunnelEndpoint<N>       This is the IP address for the IPSEC tunnel 
#                              endpoint.
#
# ipsecTunnelRemoteNetwork<N>  This is the network address of the remote network 
#                              from the perspective of the router under test.
#
# ipsecTunnelRemoteMask<N>     This is the network mask of the remote network
#                              from the perspective of the router under test.
#
# ipsecTunnelHost<N>           This is an IP address within the tunnels network
#                              address space. CDRouter will create a reachable
#                              host through the tunnel at this IP address.
#
# ipsecTunnelOutboundSpi<N>    This is the SPI number for the outbound SPI. This
#                              must match the inbound SPI configured on the 
#                              device. Values can be entered in decimal or hex 
#                              starting with 0x. For example 1000 or 0x3e8. 
#
# ipsecTunnelOutEncrypt<N>     This is the encryption type for the outbound SA.
#                              This may be 3des, des, or null.
#
# ipsecTunnelOutEncryptKey<N>  This is the key for the specified encryption 
#                              type.
#
# ipsecTunnelOutAuth<N>        This is authentication type for the outbound SA.
#                              This may be md5-hmac, sha-hmac, or null.
#
# ipsecTunnelOutAuthKey<N>     This is the key for the specified authentication 
#                              type.
#
# ipsecTunnelInboundSpi<N>     This is the SPI number for the inbound SPI. This
#                              must match the outbound SPI configured on the 
#                              device. Values can be entered in decimal or hex 
#                              starting with 0x. For example 1001 or 0x3e9. 
#
# ipsecTunnelInEncrypt<N>      This is the encryption type for the inbound SA.
#                              This may be 3des, des, or null.
#
# ipsecTunnelInEncryptKey<N>   This is the key for the specified encryption 
#                              type.
#
# ipsecTunnelInAuth<N>         This is authentication type for the inbound SA.
#                              This may be md5-hmac, sha-hmac, or null.
#
# ipsecTunnelInAuthKey<N>      This is the key for the specified authentication 
#                              type.


#
# -- Additional CDRouter IKE Configuration Options
#

# Please see the CDRouter IKE User Guide for more details.
#

# The maximum number of Phase 2 SAs that can be established for a single
# Phase 1. Defaults to 20
#
# testvar ikeMaxPhase2SA 20
#

# Support for DeadPeerDetection. Set to 'yes' or 'no'. Defaults to 'yes'
#
# testvar ikeDeadPeerDetection no
#

# The amount of time to wait after a new quick mode exchange has finished before
# verifying that the new IPSEC SA is being used. Defaults to 1000 milliseconds.
#
# testvar ikeNewQuickModeDelay 1000
#

# The minimum Phase 1 Lifetime that CDRouter-IKE will attempt. Defaults to 20 
# seconds.
#
# testvar ikeMinimumLifetime 20
#

# The minimum Phase 2 Lifetime that CDRouter-IKE will attempt. Defaults to 20 
# seconds.
#
# testvar ipsecMinimumLifetime 20
#

# The amount of time to wait in between deleting Phase 2 SAs.
#
# testvar ikePhase2DeleteDelay 100
#

# The maximum number of Phase 1 transforms that can be included in a Phase 1 
# exchange. Defaults to 21.
#
# testvar ikeMaxTransforms 21
#

# If the device does not delete IKE and IPSEC SAs when the INITIAL-CONTACT 
# message is set, the testvar ikeInitialContact should be set to no. The default
# is yes.
#
# testvar ikeInitialContact no
#

# By default, CDROuter-IKE will cycle through each configured IKE tunnel when 
# multiple tunnels are configured. If the tests should only be run on the first 
# tunnel, configure useSameIpsecTunnel to yes. 
#
# testvar useSameIpsecTunnel no
#


#
# -- IKE NAT-Traversal Configuration Options
# 

# Define the NAT-T draft that will be used by CDRouter for NAT-T. Valid values 
# are: draft-00, draft-02, draft-03, rfc-3947, or "no".
#
# If set to "no", NAT traversal will not be used and the ike-natt.tcl module 
# will be skipped. If set to a specific version, CDRouter will force NAT-T to
# detect both endpoints behind NAT and also run the ike-natt.tcl module.
#
testvar ikeNatTraversal       no


#
# -- IPSEC/IKE Example Tunnel Configurations
#

# Example IPSEC tunnel with IKE and Preshared-Key
#

# testvar ipsecTunnelEndpoint1          5.0.0.1
# testvar ipsecTunnelRemoteNetwork1     5.0.0.0
# testvar ipsecTunnelRemoteMask1        255.255.255.0
# testvar ipsecTunnelHost1              5.0.0.2
# testvar ipsecTunnelKeyType1           ike
# testvar ipsecTunnelIkeEncrypt1        des
# testvar ipsecTunnelIkeAuth1           md5-hmac
# testvar ipsecTunnelIkeGroup1          1
# testvar ipsecTunnelIkeLifetime1       300
# testvar ipsecTunnelEncrypt1           3des
# testvar ipsecTunnelAuth1              sha1-hmac
# testvar ipsecTunnelPfsGroup1          1
# testvar ipsecTunnelLifetime1          120
# testvar ipsecTunnelPsk1               qacafe123
# testvar ipsecTunnelIkeMode1           main | aggressive
# testvar ipsecTunnelUsesNat1           no | yes

# Example IPSEC tunnel 1 with manual keys
#

# testvar ipsecTunnelEndpoint1          5.0.0.1
# testvar ipsecTunnelRemoteNetwork1     5.0.0.0
# testvar ipsecTunnelRemoteMask1        255.255.255.0
# testvar ipsecTunnelHost1              5.0.0.2
# testvar ipsecTunnelOutboundSpi1       1000
# testvar ipsecTunnelOutEncrypt1        des
# testvar ipsecTunnelOutEncryptKey1     0102030405060708
# testvar ipsecTunnelOutAuth1           md5-hmac
# testvar ipsecTunnelOutAuthKey1        6262626262626262
# testvar ipsecTunnelInboundSpi1        1001
# testvar ipsecTunnelInEncrypt1         des
# testvar ipsecTunnelInEncryptKey1      0102030405060708
# testvar ipsecTunnelInAuth1            md5-hmac
# testvar ipsecTunnelInAuthKey1         6262626262626262

# Example IPSEC tunnel 2
#

# testvar ipsecTunnelEndpoint2          6.0.0.1
# testvar ipsecTunnelRemoteNetwork2     6.0.0.0
# testvar ipsecTunnelRemoteMask2        255.255.255.0
# testvar ipsecTunnelHost2              6.0.0.2
# testvar ipsecTunnelOutboundSpi2       1002
# testvar ipsecTunnelOutEncrypt2        des
# testvar ipsecTunnelOutEncryptKey2     0102030405060708
# testvar ipsecTunnelOutAuth2           null
# testvar ipsecTunnelOutAuthKey2        6262626262626262
# testvar ipsecTunnelInboundSpi2        1003
# testvar ipsecTunnelInEncrypt2         des
# testvar ipsecTunnelInEncryptKey2      0102030405060708
# testvar ipsecTunnelInAuth2            null
# testvar ipsecTunnelInAuthKey2         6262626262626262
#



# ------------------------------------------------------------------------------
#
# SECTION: TR-069 SETUP
#
# ------------------------------------------------------------------------------

# Uncomment to enable CDRouter's integrated TR-069 ACS. CDRouter will create the
# ACS at the address specified by this testvar on the WAN
#
# testvar acsIp                 6.0.0.1

# TR-069 configuration options, including the port, transport, and 
# authentication type to use. Please see the CDRouter TR-069 User's Guide for 
# more information.
#
testvar acsPort               80
testvar acsTransport          http
testvar acsAuth               digest
testvar acsDigestQopAuth      yes

# If ACS Discovery is used over DHCPv4/v6, you can set the discovery URL. By default,
# CDRouter will create a ACS Discovery URL based on the transport, IP, and port above.
# However, you can over ride this and use DNS based hostnames.
#
# testvar acsDiscoveryUrl       http://acs.qacafe.com

testvar acsWaitForInform      120
testvar acsSkipInitialInform  no
testvar acsCpeConnReqURL      http://192.168.200.2:80/cwmp

# The ACS uses CWMP protocol version 1.0 by default. TR-069 Amendment 2 defines
# CWMP protocol version 1.1. To enable CWMP 1.1 on the ACS, configure the
# cwmpProtocolVersion testvar.
#
# testvar cwmpProtocolVersion   1.0

# ACS device discovery. If set to 'yes', CDRouter will query the device and set 
# the CPE request user/password when a new Inform is received.
#
testvar acsDeviceDiscovery    no

# ACS connection initiation. If set to 'yes', CDRouter will attempt to initiate 
# new connections instead of waiting for an Inform. Either the acsCpeConnReqURL 
# must be configured, or previous Inform must have been learned.
#
testvar tr69InitiateConnection yes

# The location of the server certificate for the ACS can be configured using 
# the testvar acsCertPath.It defaults to the acs.qacafe.com.pem file which is 
# automatically installed.
#

# testvar acsCertPath /usr/share/doc/cdrouter/acs.qacafe.com.pem

# In some cases, you may also need to configure the CA for this certificate. 
# This is true if you are using an intermediate CA that is not already 
# installed on the CPE.
#

# testvar acsCaCertPath /usr/share/doc/cdrouter/acs.qacafe.com-ca.pem

# In some cases, the ACS may create a second download server running https. The 
# download server certificate can be configured using the testvars 
# acsDownloadCertPath and acsDownloadCaCertPath. It defaults to 
# acs-download.qacafe.com.pem.
#

# testvar acsDownloadCertPath /usr/share/doc/cdrouter/acs-download.qacafe.com.pem

# The default user and password on the ACS. The CPE device should use this 
# username and password when contacting the ACS.
#
testvar acsDefaultUser        qacafe
testvar acsDefaultPassword    qacafe123

# The default user and password on the CPE device. The ACS will use this
# username and password when contacting the CPE's connection request URL.
# 
testvar acsCpeDefaultUser     qacafe
testvar acsCpeDefaultPassword qacafe123

# By default, the ACS will attempt to keep the HTTP connection alive when 
# contacting the CPE connection request URL. This can be configured to 'no' to 
# close the connection.
#
testvar acsCpeKeepAlive       yes

# By default, the ACS will use MD5 for the digest algorithm when connecting to 
# the CPE Connection Request URL. This can be switched to MD5-sess by 
# configuring the testvar acsDigestMd5Sess to yes.
#
# testvar acsDigestMd5Sess      no

# Chunked encoding can be configured on the ACS server. This is not used by 
# default.
#
# testvar acsChunkedEncoding yes
# testvar acsChunkSize 64
#

# By default, CDRouter will require each CWMP request to be authenticated when 
# digest or basic authentication is used. Some ACSes only authenticate the first
# request of a session. CDRouter can be configured to only authenticate the 
# first request using acsAuthOncePerSession.
#
# testvar acsAuthOncePerSession yes
#

# ACS cookie configuration. This testvar should be set to '2' for RFC 2965 style
# cookies or '1' for older Netscape style cookies. The default cookie mode is 2.
#
# testvar acsCookieMode 2
#


# 
# -- TR-069 Device Type Configuration
#

# By default, CDRouter assumes the TR-069 device is an IGD device. You can 
# configure the expected device type by configuring a list of high level 
# parameters that should be available. The tr69DeviceType testvar accepts a 
# comma separated list of IGD, VoIP, or STB. The first device type will be a 
# primary for tests that work against multiple device types.
#
# Examples:
#
# IGD only
# testvar tr69DeviceType  "IGD"
#
# IGD with Embedded VoIP - default to VoIP parameters
# testvar tr69DeviceType  "VoIP,IGD"
#
# IGD with Embedded VoIP - default to IGD parameters
# testvar tr69DeviceType  "IGD,VoIP"
#
# Standalone VoIP device
# testvar tr69DeviceType  "VoIP"
#


#
# -- TR-069/CWMP Profile Support
#

# CDRouter uses the DeviceSummary parameter included with the initial Inform
# to determine some of the functionality supported by the device. This allow
# CDRouter to skip test cases that are not supported since the CWMP parameters
# are not implemented. If the device does not support the DeviceSummary 
# parameter, a 'fake' DeviceSummary string may be configured. To select all CWMP
# profiles that CDRouter has implemented, configure the tr69FakeDeviceSummary 
# string to 'all'.
#
# testvar tr69FakeDeviceSummary {InternetGatewayDevice:1.1[](Baseline:1,IPPing:1)}
# 
# testvar tr69FakeDeviceSummary all
#

# CWMP Profile Versions
#
# CDRouter will normally detect the supported profile versions from the 
# DeviceSummary string. By defeault, CDRouter uses "strict" matching and it will
# only test a profile if it knows about the same version of the profile. You can
# also configure CDRouter to use "best" matching which will allow CDRouter to 
# use the highest version it knows about if an exact match is not possible.
#
# Enable best case matching:
# testvar tr69ProfileMatch best
#
# Enable strict matching (default)
# testvar tr69ProfileMatch strict
#

# You may skip specific CWMP parameters using the testvar cwmpSkipParameters.
# This tetsvar takes a list of parameter that should be skipped. You can also 
# modify the "Requirement" status of each parameter.
#
# Examples:
#
# Skip the LANConfigSecurity object and RouteProtocolRx on all WAN PPP 
# connections:
#
# testvar cwmpSkipParameters {
#  InternetGatewayDevice.LANConfigSecurity.
#  InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANPPPConnection.{i}.RouteProtocolRx
# }
#
#
# Mark the MaxBitRate as read-only on all LAN Ethernet interfaces:
#
# testvar cwmpModifyParameters {
#  string R InternetGatewayDevice.LANDevice.{i}.LANEthernetInterfaceConfig.{i}.MaxBitRate
# } 
#


#
# -- Additional/Optional TR-069 Configuration Options
#

# testvar tr69InformTimeout         120
# testvar tr69MinPeriodicInform     60
# testvar tr69ScheduleInformRPC     yes
# testvar tr69UploadRPC             yes
# testvar tr69UploadPath            /tmp
# testvar tr69ConfigUploadFilename  vendor_configuration_file
# testvar tr69LogUploadFilename     vendor_log_file
# testvar tr69FactoryResetRPC       yes
# testvar tr69CpeGetRPCs            no
# testvar tr69ForceBoolean          no
# testvar tr69XMLCapturePath        /tmp/tr69-xml
# testvar tr69DownloadTimeout       600
# testvar tr69DownloadImage         /path/to/image
# testvar tr69RebootTimeout         300
# testvar tr69RpcTimeout            300
# testvar tr69DownloadConfig        /path/to/config
# testvar supportsTr111Part1        yes
# testvar tr69MaxUserNameLen        256
# testvar tr69MaxPasswordLen        256
# testvar tr69MaxCpeUserNameLen     256
# testvar tr69MaxCpePasswordLen     256
# testvar tr69DUInstallImage        /path/to/du.image
# testvar tr69DUInstallUUID         12-23-34-23
# testvar tr69DUChangeTimeout       600
#


#
# -- Additional TR-111 Part 2 configuration options
#

# testvar supportsTr111Part2           yes
