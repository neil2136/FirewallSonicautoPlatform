

# Cable/DSL Router Test Suite
# 
# Test Suite Configuration (CDRouter-Multiport)
#
# Version: 7.0
#
# 2011 QA Cafe http://www.qacafe.com
# support@qacafe.com
#
# Local.conf
#
# This is the main configuration file for CDRouter. This file defines the 
# configuration of the router under test and controls various aspects of 
# CDRouter's behavior. This file consists of a number of unique test variables 
# called 'testvars' which are grouped by interface, protocol, or functionality. 
# The basic syntax for all testvars is:
# 						
# testvar <name> <value>
#


# ------------------------------------------------------------------------------
#
# SECTION: LAN-SIDE BASIC SETUP
#
# ------------------------------------------------------------------------------

#
# -- LAN-Side Configuration
#

# The network interface defined below should be connected to the LAN interface 
# on the device under test (DUT). 
#
testvar lanInterface          eth1

# The LAN interface type. Valid options are:

#           
#    ethernet
#    802.11b
#    802.11a
#    802.11g
#    802.11n
#
testvar lanType               ethernet

#
# -- LAN Interface Settings
#

# The DUT's LAN IP address and network mask
#
testvar lanIp                 192.168.168.168 ;#swall
testvar lanMask               255.255.255.0

# The MAC address of CDRouter's LAN interface. By default, the real MAC address
# of the hardware device will be used.
#
# testvar lanMac                00:0a:0a:00:00:01

# The largest LAN IP MTU that can be forwarded by the router. If set to 
# 'default', the MTU will be selected dynamically based on the WAN protocol that
# is running. Otherwise, this value should be set to the specific MTU desired.
#
# The default MTU values in 'default' mode are:
#
#       static      1500
#       DHCP        1500
#       PPPoA       1500
#       PPPoE       1492
#       PPTP        1460
#       L2TP        1460
#       PPP/T1      1500
#       dslite      1500    
#

testvar lanMtu                default


#
# -- LAN 802.1q VLAN
#

# If the LAN interface is part of an 802.1q VLAN, configure the VLAN ID using 
# the testvar lanVlanId. You can also change the default 802.1p priority used on
# the LAN interface by configuring the testvar lanVlanPriority. Valid priority 
# values are 0 - 7.
#
# testvar lanVlanId             100
# testvar lanVlanPriority       0



# ------------------------------------------------------------------------------
#
# SECTION: WAN-SIDE BASIC SETUP
#
# ------------------------------------------------------------------------------

#
# -- WAN-side Configuration
#

# The network interface defined below should be connected to the WAN interface 
# on the router under test, DSLAM device, or WAN side of the network.
#
testvar wanInterface          eth3

# The ISP's IP address. This address represents the next-hop gateway for the DUT
# on the WAN.
#
testvar wanIspIp              100.10.0.11

# The address the ISP will assign to the DUT on the WAN
#
testvar wanIspAssignIp        100.10.0.10

# The address the DUT will use as its NAT source address. NOTE: This is normally
# the same as the 'wanIspAssignIp' address above. However, a different address 
# can be specified to support other test topologies.
#
testvar wanNatIp              100.10.0.10

# A free address used for renumbering tests. This address should be on the same 
# IP network as the wanIspIp.
#
testvar wanIspNextIp          100.10.0.3

# The network mask of the WAN interface
#
testvar wanIspMask            255.255.255.0

# The MAC address of the WAN interface. Comment this out to use the real MAC 
# address of the wanInterface device.
#
testvar wanMac                00:0b:0b:00:00:01

# The expected MAC address of the DUT's WAN interface. If the DUT is configured 
# to clone a specific MAC address on the WAN, this testvar should match the 
# cloned MAC address. This testvar is used to validate the DUT's expected source
# MAC address in the basic module.
#
# Example with DUT configured to clone the MAC 00:0b:0b:0b:0b:0b on the WAN
#
# testvar wanDutMac 00:0b:0b:0b:0b:0b
#

# The domain name assigned by the ISP
#
testvar wanDomainName         qacafe.com

# The DNS server assigned by the ISP
#
testvar wanDnsServer          1.1.1.1
testvar wanBackupDnsServer    1.1.1.2

# The forwarding mode of the device. This is normally set to 'route' for
# a routing device or 'bridge' for a layer 2 bridging devices. For bridging
# devices, the wanMode is still used to determine how the CPE device 
# obtains its management IPv4 address.
#
testvar forwardingMode        route

# The following IPv4 WAN protocols are supported by CDRouter
#
# static   The router has a statically configured WAN IP address. The address
#          should be configured under 'wanIspAssignIp'. None of the
#          DHCP or renumbering tests will be run.
#
# DHCP     The router runs a DHCP client on the WAN interface.
#
# PPPoE    The router runs a PPPoE client on the WAN interface.
#
# PPPoA    The router runs a PPPoA client on the WAN interface.
#
# PPTP     The router runs a PPTP client on the WAN interface.
#
# L2TP     The router runs a L2TP client on the WAN interface.
#
# PPP/T1   The router runs a PPP client on the WAN T1/E1 interface.
#
# dslite   The router uses DS-Lite IPv4 over IPv6 tunnels. Requires IPv6.
#
testvar wanMode               static

# Normally the IPv4HopCount is set to 1. However, if the 'wanMode' is set to
# 'static' the test suite can be used to test end-to-end through a network that 
# contains additional IPv4 devices that change the hop count. The 'IPv4HopCount'
# value should be set to the expected number of hops between the LAN and WAN 
# interfaces.

testvar IPv4HopCount          1


#
# -- PPPoE Configuration
#

testvar pppoeConnectOnDemand  no
testvar pppoeUser             qacafe
testvar pppoePassword         qacafe123
testvar pppoeAcName           qacafe-ac

# The PPPoE server name that will be used by the PPPoE server. Most routers will
# accept any service name. You can set this to 'any' to use PPPoE's concept of 
# 'any' service.
#
testvar pppoeServiceName      qacafe

# The PPPoE AC-Cookie Tag. By default the CDRouter PPPoE server does not use an 
# AC-Cookie Tag. You can configure the server to use a specific AC-Cookie Tag 
# value, or configure the AC-Cookie in 'auto' mode so that CDRouter generates 
# a unique cookie automatically.
#
# Examples:
#
# testvar pppoeAcCookie auto
# testvar pppoeAcCookie 010203040506


#
# -- PPPoA Configuration
#

testvar pppoaUser             qacafe
testvar pppoaPassword         qacafe123
testvar pppoaConnectOnDemand  no


#
# -- PPP/T1 Configuration
#

testvar pppUser               qacafe
testvar pppPassword           qacafe123
testvar pppConnectOnDemand    no


#
# -- PPTP Configuration
#

testvar pptpUser              qacafe
testvar pptpPassword          qacafe123
testvar pptpConnectOnDemand   yes

# PPTP creates a tunneled PPP connection once the PPTP control session is 
# established. CDRouter will assign a new IP address to the PPTP client using 
# this PPP session. Each end of the PPP connection must be configured using the 
# testvar pptpServerIp and pptpClientIp. The testvar wanNatIp should also be 
# updated to match the testvar pptpClientIp since connections going out the PPTP
# WAN will normally go through NAT using the local PPP address from PPTP.
#
testvar pptpServerIp          192.168.3.1
testvar pptpClientIp          192.168.3.2

# By default, PPTP requires static IP addressing for the initial IPv4 
# configuration. However, you can also configure CDRouter to run a DHCP server 
# on the WAN interface for the PPTP client to learn its initial IPv4 address. To
# enable the DHCP on the WAN when running PPTP set the testvar pptpUseDHCP to 
# yes.
#
# testvar pptpUseDHCP yes
#


#
# -- L2TP Configuration
#

testvar l2tpUser              qacafe
testvar l2tpPassword          qacafe123
testvar l2tpConnectOnDemand   yes

# L2TP creates a tunneled PPP connection once the L2TP control session is 
# established. CDRouter will assign a new IP address to the L2TP client using 
# this PPP session. Each end of the PPP connection must be configured using the 
# testvar l2tpServerIp and l2tpClientIp. The testvar wanNatIp should also be 
# updated to match the testvar l2tpClientIp since connections going out the L2TP
# WAN will normally go through NAT using the local PPP address from L2TP.
#
testvar l2tpServerIp          192.168.3.1
testvar l2tpClientIp          192.168.3.2

# By default, L2TP requires static IP addressing for the initial IPv4
# configuration. However, you can also configure CDRouter to run a DHCP server 
# on the WAN interface for the L2TP client to learn its initial IPv4 address. To
# enable the DHCP on the WAN when running L2TP set the testvar l2tpUseDHCP to 
# yes.
#
# testvar l2tpUseDHCP yes
#


#
# -- DS-Lite Configuration
#

# DS-Lite provides tunneled IPv4 connectivity over a native IPv6 connection. 
# There are two primary endpoints in a DS-Lite network: the "B4" element is 
# located within the DUT and is responsible for encapsulating and transmitting
# IPv4 packets over an IPv6 connection on the WAN to the "AFTR" element. The 
# AFTR is an IPv6 host maintained by the ISP that acts as the DS-Lite tunnel 
# endpoint. In a DS-Lite network the IPv4 NAT functionality typically performed 
# by the DUT is moved into the ISP's network. As a result, in a DS-Lite 
# configuration the DUT does not have distinct WAN and LAN IPv4 addresses. The 
# DUT's private LAN IPv4 address and network are routed directly to the ISP. 
#
# The testvar ipv6DsliteAftr specifies the global IPv6 address of the AFTR 
# element, which will be automatically created by CDRouter on the WAN. This 
# address must be on a different IPv6 network than the DUT's WAN interface.  
#
testvar ipv6DsliteAftr        3001:aaaa::1  

# The testvar dhcpv6WanAftrName specifies the domain name of the AFTR element. 
# CDRouter's DNS servers will automatically resolve the AFTR element's domain
# name to the address specified by the testvar ipv6DsliteAftr.
#
testvar dhcpv6WanAftrName     aftr.qacafe.com


#
# -- Global PPP Configuration Options
#

# The following PPP authentication types are supported
#
#       PAP
#       CHAP
#       MSCHAP
#       MSCHAPv2
#       None
#
testvar pppAuthType           PAP

# Set this option to force the LCP MRU to a specific value. By default, CDRouter
# will determine the MRU value based on the WAN protocol. This option should 
# only be used as a work around for routers that can not negotiate the LCP MRU.
#
# testvar pppForceLcpMRU      1500

# By default PPP includes the LCP Magic Number option. You can configure PPP not
# to use the LCP Magic Number option by setting the pppMagicNumber testvar to 
# no.
#
# testvar pppMagicNumber no

# Set this option to specify a delay in seconds to wait after a PPP session
# is established before the the PPP session is used. The default is 10 seconds.
#
# testvar pppConnectionDelay 10

# The amount of time CDRouter waits to recover any PPP based link can be 
# configured by adjusting the testvar pppRestartTimeout. This variable contains 
# the number of milliseconds to wait for PPP based protocols to recover. The 
# default is 300000 (300 seconds).
#
# testvar pppRestartTimeout 300000


#
# -- WAN 802.1q VLAN
#

# If the WAN interface is part of an 802.1q VLAN, configure the VLAN ID using 
# the testvar wanVlanId. You can also change the default 802.1p priority used on
# the WAN interface by configuring the testvar wanVlanPriority. Valid priority 
# values are 0 - 7.
#
# testvar wanVlanId             100
# testvar wanVlanPriority       0



# ------------------------------------------------------------------------------
#
# SECTION: LAN-SIDE WIRELESS SETUP
#
# ------------------------------------------------------------------------------

# For wireless LAN interfaces, you can specify the SSID to use. If no SSID is 
# specified, the existing SSID of the wireless interface is used.
#
testvar lanSSID               qa-net


#
# -- WPA Encryption Configuration Options
#

# Some devices support 802.11i Wi-Fi Protected Access mode (WPA). CDRouter 
# supports both WPA-PSK and WPA-RADIUS.
#
# Valid options are:
#
#     WPA-PSK
#     WPA-RADIUS
#
# testvar wirelessAuthType      WPA-PSK

# The specific version of WPA can be configured as WPA or WPA2. You may need an 
# updated version of DriverLoader and a supported wireless card for WPA2.
#
# Valid options are:
#
#     WPA
#     WPA2
#
# testvar wpaMode               WPA
 
# WPA pairwise key cipher selection
#
# Valid options are:
#
#     TKIP
#     AES-CCMP
#
# testvar wpaCipher             TKIP

# WPA group key cipher selection
#
# By default, CDRouter will use the same cipher for the group as the pairwise 
# key. The testvar wpaGroupCipher may be used to configure a group key cipher 
# that is different than the pairwise key cipher.
#
# Valid options are:
#
#     TKIP
#     AES-CCMP
#
# testvar wpaGroupCipher        TKIP

# For WPA encryption you can specify either an ascii passphrase that is 8-63 
# characters long, or a 64-character hexadecimal key. This key must match the
# key entered on the Device.
#
# Examples are:
#
# testvar wpaKey qacafe123
# testvar wpaKey 8c53b145d4457493967b525e4065fb6d4e2e39597c36c10d4ff7648c515dd6c9


# Additional WPA configuration options. Contact support@qacafe.com for 
# additional details on the these options. Generally, you should not have to set
# these testvars.
#
# testvar wpaIncludeRSNCaps yes
# testvar wpa802dot11draft 3
#


#
# -- WEP Encryption Configuration Options
#

# For WEP encryption on wireless LAN interfaces, you can specify either a 40 or 
# 128 bit key length. For 40 bit WEP keys, enter 10 hex digits. For 128 bit WEP 
# keys, enter 26 hex digits. If no WEP key is specified, the existing WEP key 
# (if any) of the wireless interface is used. To disable WEP configure the 
# lanWEPKey to 'off'.
#
# Examples are:
#
# testvar lanWEPKey           0102030405
# testvar lanWEPKey           0102030405060708090a010203
#
testvar lanWEPKey             off

# You can also specify the specific WEP key index if necessary. The default WEP 
# key index is 0. Valid WEP key index values are 0 - 3.
#
# testvar lanWEPKeyIndex      0
#


# ------------------------------------------------------------------------------
#
# SECTION: WAN-SIDE ATM SETUP
#
# ------------------------------------------------------------------------------

#
# -- ATM Interface PVC Configuration
#

# To configure an ATM PVC interface on the WAN, use wanAtmInterface. The format 
# for an ATM interface name is:
#
#    <ATM card number>.<VPI>.<VCI>
#
# If only a single ATM card is installed, the card number is 0. The ATM 
# encapsulation type must also be specified. The following types are supported:
#
#    1483Bridged-LLC          RFC1483/2684 Bridged LLC Encapsulation 
#    1483Bridged-VC           RFC1483/2684 Bridged VC Based Multiplexing
#    1483Routed-LLC           RFC1483/2684 Routed LLC Encapsulation 
#    1483Routed-VC            RFC1483/2684 Routed VC Based Multiplexing
#    PPPoA-LLC                RFC2364 LLC Encapsulated PPP
#    PPPoA-VC                 RFC2364 VC Multiplexed PPP
#
# testvar wanAtmInterface       0.0.35
# testvar wanAtmEncap           PPPoA-VC
#


#
# -- T1/E1 Interface Configuration Options
#

# To configure a T1 interface on the WAN, set the wanT1Interface testvar to
# the device name for the T1 interface. For help on configuring the T1 device, 
# please see the user guide. 
#
# The following encapsulations are supported on the T1/HDLC interface:
#
#    FrameRelay
#    PPP
#
# Example for Frame Relay configuration:
#
# testvar wanT1Interface       wp1chdlc
# testvar wanT1Encap           FrameRelay
# testvar wanT1FrameRelayDlci  16
#
# Example for PPP configuration:
# 
# testvar wanT1Interface       wp1chdlc
# testvar wanT1Encap           PPP
#

# For newer Sangoma T1 Cards (A101, A102, etc), the HDLC checksum is not 
# included on incoming packets. The testvar wanHdlcChecksum should be
# configured to no when using these cards.
#
# testvar wanHdlcChecksum no
#



# ------------------------------------------------------------------------------
#
# SECTION: DHCP SETUP
#
# ------------------------------------------------------------------------------

#
# -- DHCP Server Configuration
#

# Note: This timeout should be at least 2 * retransmission timeout of the
# client. Otherwise, the lease will actually timeout during any retransmission
# tests. The lease should be long enough to allow the client to deal with
# timeouts when it is trying to renew/rebind. To return an infinite DHCP
# lease to the WAN client, set this to 'infinite'. If the lease is 'infinite',
# tests that require the WAN client to renew will be skipped.
#
testvar dhcpLeaseTime         300

# When 'dhcpServerBroadcast' is set to yes, the DHCP server will send all
# DHCP responses to the broadcast address 255.255.255.255. The default 
# behavior is to send all DHCP responses to the unicast address being assigned.
#
# testvar dhcpServerBroadcast  yes
#


#
# DHCP Server Extra Options
#

# You can configure the CDRouter DHCP server to provide extra DHCP options to 
# the WAN DHCP client. Up to 255 additional DHCP options can be configured. Each
# DHCP option is configured using 2 testvar entries for the DHCP option code and
# raw hex data for the option. The DHCP option data must be converted into the 
# raw ascii hex format. NOTE: You do not need to include the total option length
# in the data portion since this will be computed automatically. See the 
# CDrouter User's Guide for more examples.
#
# Example, to add DHCP option 69 and DHCP option 71
#
# testvar dhcpServerOptionCode1  69
# testvar dhcpServerOptionData1  04040404
# testvar dhcpServerOptionCode2  71
# testvar dhcpServerOptionData2  0404040504040406
#


#
# -- DHCP Client Configuration
#

# The DHCP client timeout can be used to control the behavior of the DHCP client
# on the LAN side. Normally, this timeout should not be modified. If you are 
# testing a slow DHCP server, you may need to increase this timeout. The timeout
# value is in seconds.
#
# testvar dhcpClientTimeout     5

# If the DHCP server on the router does not support DHCPINFORM request
# configure the testvar dhcpInform to no.
#
# testvar dhcpInform            no

# If the DHCP client on the WAN interfaces does not attempt to connect until
# traffic is forwarded on the LAN, set dhcpConnectOnDemand to 'yes'. Otherwise,
# set dhcpConnectOnDemand to no. NOTE: Most dhcp clients on the WAN interface
# will attempt to discover the DHCP server after reboot.
#
testvar dhcpConnectOnDemand   no

# The DUT's LAN DHCP pool range. NOTE: This range should not include the 
# server's IP address on the LAN side
#
testvar dhcpClientStart       192.168.168.2
testvar dhcpClientEnd         192.168.168.7

# You can exclude specific IPv4 addresses from the DHCP pool range configured 
# above. The testvar dhcpClientExclude is used to configure a list of IPv4 
# addresses that should be excluded. These IPv4 addresses must be within the 
# DHCP pool range.
#
# testvar dhcpClientExclude "192.168.1.47 192.168.1.48"
#

# Many DHCP server implementations allow addresses within the DHCP pool to be 
# reserved for specific clients based on the client's MAC address. Up to 10 
# unique DHCP client reservations can be configured using instances of the
# testvars dhcpClientReservedIp and dhcpClientReservedMac. These IPv4 addresses 
# must be within the DHCP pool range.
#
# testvar dhcpClientReservedIp1 192.168.1.10
# testvar dhcpClientReservedMac1 00:11:22:33:33:44
#
# testvar dhcpClientReservedIp2 192.168.1.15
# testvar dhcpClientReservedMac2 00:11:22:33:33:55
#

# DHCP pacing configuration to slow down the DHCP scaling tests. These testvars 
# can be used to control the speed at which DHCP clients are created and 
# released. Some routers are not able to process large numbers of DHCP protocol 
# events if they happen too quickly.The delays are in milli-seconds.
#
# To add a delay in between the creation of each DHCP client:
#
# testvar dhcpCreateDelay       0

# To add a delay in between the release of each DHCP client lease:
#
# testvar dhcpReleaseDelay      300


# 
# -- DHCP Client Extra Parameters
#

# You can configure the CDRouter DHCP client to request extra DHCP options in 
# the DHCP Option Parameter list. The testvar dhcpExtraClientParams can be used 
# to specify extra parameters. 
#
# Example, to add DHCP option 71
#
# testvar dhcpExtraClientParams "71"
#   
# Example, to add DHCP options 69 and 70
#
# testvar dhcpExtraClientParams "69 70"
#


#
# -- DHCP Client Extra Options
#

# You can configure the CDRouter DHCP client to provide extra DHCP options
# while running DHCP on the LAN. Up to 10 additional DHCP options can be
# configured. Each DHCP option is configured using 2 testvar entries for the 
# DHCP option code and raw hex data for the option. The DHCP option data must be
# converted into the raw ascii hex format. NOTE: You do not need to include the 
# total option length in the data portion since this will be computed 
# automatically. See the user's guide for more examples.
#
# Example, to add DHCP option 124 and DHCP option 125
#
# testvar dhcpClientOptionCode1  124
# testvar dhcpClientOptionData1  000000000401020304
# testvar dhcpClientOptionCode2  125
# testvar dhcpClientOptionData2  000000000401020304
#


#
# -- Internal DHCP Server
#

# If the DUT does not support DHCP on the LAN side, you can configure CDRouter 
# to use its own internal DHCP server on the LAN. Any DHCP client that CDRouter 
# creates will automatically receive an IP address from an internal server. 
# NOTE: If this option is set to yes, any DHCP server related test cases will 
# not be executed.
#
# testvar useInternalDHCP       no

# By default, CDRouter will assign the router's LAN IP address as the DNS server
# address when using the internal DHCP server. This can be changed by 
# configuring the testvar internalDHCPdns to a different DNS server. This should
# normally match the wanDnsServer testvar.
# 
# testvar internalDHCPdns 1.1.1.1
#


#
# -- WINS Server Configuration
#

# If the DUT is configured to provide a WINS server to DHCP clients on the LAN 
# interface, you may configure the winsServer1 and winsServer2 testvars. If only
# one WINS server is supported, the winsServer2 entry should be commented out. 
#
# testvar winsServer1           3.3.3.4
# testvar winsServer2           3.3.3.5


#
# -- DHCP Vendor Class Identifier for LAN Clients
#

# A DHCP Vendor Class Identifier may be configured for all LAN clients. By 
# default, no Vendor Class Identifier is used.
#
# testvar dhcpClientVendorClass myIpDevice
#


#
# Static Hosts Entries
#

# Any static host address should be outside of the DHCP client address pool 
# range. The cdrouter LAN side will respond to ARP requests for any IP address 
# defined with a 'staticHost' entry. These entries are not normally used.
#
# testvar staticHost1           192.168.1.125
# testvar staticHost2           192.168.1.126
#



# ------------------------------------------------------------------------------
#
# SECTION: DYNAMIC DNS SETUP
#
# ------------------------------------------------------------------------------

# Some routers support automatically updating with the DynDNS.org service 
# provided by Dynamic Networks Systems, Inc. To enable DynDNS within CDRouter, 
# set the testvar supportsDynDns to 'yes'.
#  
testvar supportsDynDns        no

# The WAN IP address for the service. CDRouter will create a DynDNS server at 
# this IP address. 
#
testvar dynDnsServerIp        66.37.215.49

# The DynDNS transport protocol. The default is http. However, you may also 
# specify https.
#
# testvar dynDnsTransport http
#

# DynDNS client configuration. Note: Routers may or may not let you configure 
# each of these options. If the device being tested does not support a 
# particular option, leave it commented out.
#
testvar dynDnsHostname        test.domain.com
testvar dynDnsUsername        qacafe
testvar dynDnsPassword        qacafe123

# Some less less common DynDNS options:
#
#  testvar dynDnsSystem	      dyndns
#  testvar dynDnsMx	      mail.domain.com
#  testvar dynDnsBackMx	      no
#  testvar dynDnsWildcard     off
#

# The DynDNS client user-agent. This should match the value specified by the 
# client in the HTTP headers during a DynDNS update.
#
testvar dynDnsAgent           RAS/1.1

# Additional time to wait for DynDNS updates AFTER the WAN is established. 
# Enable this timeout if tests are failing because the router hasn't updated 
# yet.
#
testvar dynDnsWait            30

# DynDNS error codes should disable the DynDNS service on the device, forcing 
# any subsequent tests to fail. Setting this to 'yes' will allow you to run 
# the error handling tests which would not normally run.  Note that this will 
# disable the regular DynDNS functioning tests.
#
# testvar testDynDnsErrorCode   yes
#

# Error code for the server to return when doing the Error handling test. The
# following error codes are available:
#
#   badsys 
#   badagent 
#   badauth 
#   !donator 
#   nochg 
#   notfqdn 
#   nohost 
#   !yours 
#   abuse 
#   numhost 
#   dnserr
#
# testvar dynDnsServerReturn    !yours
#



# ------------------------------------------------------------------------------
#
# SECTION: DNS SETUP
#
# ------------------------------------------------------------------------------

# Many routers relay the DNS server learned on the WAN side as a DHCP option to 
# DHCP clients on the LAN. However, some routers only announce the LAN side IP 
# address as the DNS server and forward all DNS traffic to the WAN side DNS 
# server.
#
testvar DNStoDHCP             yes

# If DNS proxy is supported on the router, set the testvar supportsDnsProxy to 
# 'yes'. Set to 'no' otherwise.
#
testvar supportsDnsProxy      yes

# The default DNS lookup timeout is 5 seconds. This can be adjusted if the DNS 
# proxy is slow to respond.
#
# testvar dnsLookupTimeout    5
#

# DNS error codes that cause the DNS proxy to failover to the backup DNS server.
# There is a set of error codes for an Authoritative DNS response and a set of 
# error codes for a Non-Authoritative DNS response. If DNS failover is not 
# supported, both of these failover lists should be set to "none".
#
# Authorative DNS Error Codes that cause failover
testvar dnsFailoverAuth       "2 4 5"

# Non-Authorative DNS Error Codes that cause failover
testvar dnsFailoverNonAuth    "2 4 5"


#
# -- User Configurable DNS Entries
#

# You may specify up to 10 hostname to IP address mappings that you wish to have
# exist in all of CDRouter's DNS servers. Each entry needs a dnsHostname<N> and 
# cooresponding dnsIp<N>
#
# Examples:
#
# testvar dnsHostname1          test.qacafe.com
# testvar dnsIp1                5.5.5.5
#
# testvar dnsHostname2          foo.qacafe.com
# testvar dnsIp2                5.5.5.6
#




# ------------------------------------------------------------------------------
#
# SECTION: NTP SETUP
#
# ------------------------------------------------------------------------------

# CDRouter can provide up to 2 NTP timeservers on the WAN interface. To 
# configure a NTP timeserver, use the ntpServer1 and ntpServer2 testvars to 
# configure an IP address for each server. The IP addresses should not be the 
# same as any other network elements such as the remoteHostIp, or wanIspIp.
#
# The NTP servers can also be mapped to specific DNS names using the testvar 
# ntpServerName1 and ntpServerName2 testvars.
# 
testvar ntpServer1            3.3.3.6
testvar ntpServerName1        time.nist.gov

testvar ntpServer2            3.3.3.7
testvar ntpServerName2        time.foo.com

# By default, the NTP server will use the local time from the CDRouter host. You
# can configure the NTP server to use a specific starting date to adjust 
# the NTP time.
#
# Examples:
#
# Set the date to March 1st, 2008
# testvar ntpStartDate 3/1/2008
#
# Set the date to June 2, 2007 11 am UTC time
#
# testvar ntpStartDate          "6/2/2007 11:00 am UTC"

# By default, the NTP server will use the local time from the CDRouter host. 
# You can specify an offset in seconds to adjust the time forward or backward.
#
# Examples:
#
# To move ahead one day:
# testvar ntpOffset 86400
#
# To move back one year
# testvar ntpOffset -31536000
#



# ------------------------------------------------------------------------------
#
# SECTION: LAN EAPOL SETUP
#
# ------------------------------------------------------------------------------

# If you are running EAPOL on the lanInterface, configure lanUseEAPOL to yes.
# Otherwise, lanUseEAPOL should be set to no.
#
#testvar lanUseEAPOL           no


# Configure the EAP type to use. Supported eapTypes are:
#
#  eap-md5   
#  eap-tls
#  eap-ttls
#  eap-peap
#  eap-sim
#  eap-aka
#
testvar eapType               eap-tls

# To enable dynamic WEP behavior for those EAP types that send EAPOL-Key 
# packets, configure eapDynamicWep to 'yes'. Otherwise, set to 'no'.
# 
#testvar eapDynamicWep         no

# Configure one or more EAP identities and corresponding passwords (for eap-md5,
# eap-ttls, eap-peap) or certificate information (for eal-tls). Up to 512 EAP 
# identities can be configured. For EAP-TLS you must also configure a path name 
# to the user certificate file, and private key. The certificate and private key
# may live in the same file. 
#
#    eap-md5    only requires the identity and password
#    eap-tls    requires the identity and certificate information
#    eap-ttls   requires the identity, password, and certificate information
#    eap-peap   only requires the identity and password
# 


testvar eapIdentity1          user1
testvar eapPassword1          qacafe123
testvar eapUserCertPath1      /usr/share/doc/cdrouter/user1.pem
testvar eapUserCertPassword1  qacafe123
testvar eapUserPrivateKey1    /usr/share/doc/cdrouter/user1.pem

testvar eapIdentity2          user2
testvar eapPassword2          pw123
testvar eapUserCertPath2      /usr/share/doc/cdrouter/user2.pem
testvar eapUserCertPassword2  qacafe123
testvar eapUserPrivateKey2    /usr/share/doc/cdrouter/user2.pem


# EAP related timers and counters. These should not be changed unless they are 
# known for the EAP implementation you are testing.
#
testvar eapTxWhen             60
testvar eapQuietPeriod        60
testvar eapReAuthMax          2
testvar eapSendLogoffFailure  yes

# The eapReAuthPeriod is the reauthentication interval for the 802.1x 
# authenticator. If not specified, the default is 3600 seconds. If set to 0, the
# reauthentication test will not be run. Depending on the reauthentication 
# interval supported on the authenticator, the reauthentication tests can take a
# long time to complete. Some devices allow this value to be configured.
#
testvar eapReAuthPeriod       0


#
# -- Additional EAP-TLS Configuration Options
#


testvar eapRootCert           /usr/share/doc/cdrouter/root.pem
testvar eapServerCertPath     /usr/share/doc/cdrouter/server.pem

testvar eapServerCertPassword qacafe123
testvar eapFragmentSize       1024


# ------------------------------------------------------------------------------
#
# SECTION: WIRELESS RADIUS SETUP
#
# ------------------------------------------------------------------------------

# A built in RADIUS server for wireless WPA authentication can be enabled. When 
# the RADIUS server is enabled, it will run on the remoteHost address.
#
# On the device under test, you must configure the IP address for the RADIUS 
# server using the same IP address configured as the remoteHost IP address.
#
# The RADIUS server will build its own user database based on the list of EAP 
# identities and passwords defined in this configuration file.
#
testvar enableRADIUSserver    yes
testvar radiusSecret          qacafe123

# You can configure the CDRouter RADIUS server to provide extra RADIUS 
# attributes to any RADIUS client. Up to 255 additional RADIUS attributes can be
# configured. Each RADIUS attribute is configured using two testvar entries for 
# the RADIUS attribute type and raw hex data for the attribute. The RADIUS 
# attribute data must be converted into the raw ascii hex format. See the 
# CDRouter User's Guide for more examples.
#
# Example, to add RADIUS attribute 200 and RADIUS attribute 201
#
# testvar radiusServerAttrType1  200
# testvar radiusServerAttrData1  04040404
# testvar radiusServerAttrType2  201
# testvar radiusServerAttrData2  0404040504040406
#



# ------------------------------------------------------------------------------
#
# SECTION: WAN 802.1x SETUP
#
# ------------------------------------------------------------------------------

# A second RADIUS server for 802.1x authentication may be enabled on the WAN 
# side of the device.
#
testvar wanRadiusEnable       no
testvar wanRadiusIp           3.3.3.44
testvar wanRadiusSecret       qacafe123

# You can configure the CDRouter RADIUS server to provide extra RADIUS 
# attributes to any RADIUS client. Up to 255 additional RADIUS attributes can be
# configured. Each RADIUS attribute is configured using 2 testvar entries for 
# the RADIUS attribute type and raw hex data for the attribute. The RADIUS 
# attribute data must be converted into the raw ascii hex format. See the 
# CDRouter User's Guide for more examples.
#
# Example, to add RADIUS attribute 200 and RADIUS attribute 201
#
# testvar wanRadiusServerAttrType1  200
# testvar wanRadiusServerAttrData1  04040404
# testvar wanRadiusServerAttrType2  201
# testvar wanRadiusServerAttrData2  0404040504040406
#

# The WAN side RADIUS server may use eap-md5, eap-tls, or eap-ttls
#
testvar wanEapType            eap-md5

# For eap-tls or eap-ttls configurations, you must configure the certificates
# that will be used by the RADIUS server. By default, the RADIUS server
# uses the self signed server.pem server certificate and root.pem root CA.  
#

testvar wanEapRootCert           /usr/share/doc/cdrouter/root.pem
testvar wanEapServerCertPath     /usr/share/doc/cdrouter/server.pem

testvar wanEapServerCertPassword qacafe123
testvar wanEapFragmentSize 1024

#
# -- EAP Identities
#

# Up to 20 unique EAP identities can be configured for 802.1x authentication 
# on the WAN. At least one of these EAP identies must match the identity used
# by the DUT's WAN 802.1x supplicant. CDRouter can be configured to accept any 
# password for a particular EAP identity by conifguring the testvar 
# wanEapPassword with a value of '*'.
#
# Note that CDRouter includes 20 self signed client certificates (user1.pem 
# through user20.pem) which can be installed on the DUT's WAN 802.1x supplicant
# for eap-tls and eap-ttls configurations. These client certificates can be
# authenticated using the default root CA installed on CDRouter's WAN 802.1x
# RADIUS server. If the DUT's WAN side 802.1x supplicant is using a real 
# certificate, CDRouter's RADIUS server must be configured with the appropriate 
# root CA required for authentication
#
testvar wanEapIdentity1       user1
testvar wanEapPassword1       qacafe123





# ------------------------------------------------------------------------------
#
# SECTION: PROTOCOL PASS THROUGH SETUP
#
# ------------------------------------------------------------------------------


#
# -- IPSEC Pass Through Configuration
#

testvar supportsIPSECpass     yes

# Most routers support IPSEC pass through using private addresses on the LAN 
# interface. Normally, the ipsecAddressType should be set to 'private'. However,
# some routers require a DMZ type configuration where the public IP address is 
# used on the LAN side. In these cases, the ipsecAddressType should be set to 
# 'public'.
#
# private     Private IP addres used on LAN side
# public      Public IP address used on LAN side (DMZ style)
#
testvar ipsecAddressType      private

# The maximum number of IPSEC pass through tunnels that can be created
#
testvar ipsecMaxTunnels       20

# Set to yes if all IPSEC pass through connections in the scaling tests should
# attempt to use the same IP address as the IPSEC tunnel endpoint. If no, each
# IPSEC pass through connection will be made to a unique IP destination address.
#
testvar ipsecScaleSameServer  no

# Set to' yes' to enable IKE traffic whenever IPSEC ESP tunnels are tested
#
# testvar alwaysUseIke          yes

# Set to 'yes' to force all IKE and IPSEC packets to be transmitted more than 
# once. Some IPSEC pass through implementations may drop the first IKE or IPSEC 
# ESP packet when setting up a pass-through connection.
#
# testvar ipsecPassRetransmit   yes


# If the router uses a pass-through mechanism for any IP protocol type, the 
# testvar unknownPassthrough should be set to yes. The default is no.
#
# testvar unknownPassthrough    yes


#
# -- PPTP Pass Through Configuration
#

testvar supportsPPTPpass      yes

# The maximum number of PPTP tunnels that can be created
#
testvar pptpMaxTunnels        20


#
# -- L2TP pass through supported
#

testvar supportsL2TPpass      yes

# The maximum number of L2TP pass through tunnels that can be created
# 
testvar l2tpMaxTunnels        20


#
# -- PPPoE pass through supported
#
 
testvar supportsPPPoEpass     no



# ------------------------------------------------------------------------------
#
# SECTION: RIP SETUP
#
# ------------------------------------------------------------------------------

# If the DUT supports RIP, set this testvar to 'yes' to enable RIP within
# CDRouter.
#
testvar ripSupported          no

# The RIP version support by the DUT, either '1' or '2'
#
testvar ripVersion            1

# For RIPv2, the mode may be set to multicast, broadcast, or limited-broadcast. 
# If multicast RIP updates will be sent to 224.0.0.9. If broadcast, RIP updates will 
# be sent to the network broadcast address. In limited-broadcast, the updates
# will be sent to 255.255.255.255.  The default is multicast.
#
testvar ripV2mode             multicast

# RIP authentication for RIPv2. If RIPv2 simple password authentication is 
# enabled on the router, configure ripPassword with the same text password and 
# set the ripAuthMode to simple.
#
# If you are using RIPv2 MD5 Authentication, set the ripAuthMode to md5 and 
# configure the password.
#
# If there is no RIPv2 Authentication, set the mode to none
#
# testvar ripAuthMode           none
# testvar ripPassword           qacafe123

# Max number of RIP routes
#
testvar ripMaxRoutes          96

# RIP Route Timeout
#
testvar ripRouteTimeout       180

# RIP GarbageTimeout          
#
testvar ripGarbageTimeout     120

# The RIP route processing delay. This is the number of milliseconds to wait 
# before a route learned via RIP is installed in the router's routing table 
# and ready to forward traffic. It defaults to 3 seconds (3000 milliseconds).
#
testvar ripRouteDelay         3000

# If the DUT accepts RIP updates on the WAN, the testvar ripAcceptWanUpdate
# should be set to yes. It defaults to no.
#
testvar ripAcceptWanUpdate    no



# ------------------------------------------------------------------------------
#
# SECTION: STATIC ROUTE SETUP
#
# ------------------------------------------------------------------------------

# To configure a static route, use either the Lan or Wan side testvar
# configuration. Up to 100 LAN or WAN static routes may be configured. CDRouter 
# will create all nexthop IP gateways when it is testing static routes.
#
# Example LAN side static route:
#
# testvar staticRouteLanNetwork1  2.0.0.0/255.255.255.0
# testvar staticRouteLanNextHop1  192.168.1.18
#

# WAN side static routes can be configured with either the name of the WAN 
# interface for the nexthop gateway or an actual IP address of the WAN.
#
# Example WAN side static route:
#  
# testvar staticRouteWanNetwork2  5.0.0.0/255.255.255.0
# testvar staticRouteWanNextHop2  wan
#
# testvar staticRouteWanNetwork3  4.0.0.0/255.255.255.0
# testvar staticRouteWanNextHop3  wan2
#



# ------------------------------------------------------------------------------
#
# SECTION: SPECIAL APPLICATION PORT TRIGGERS SETUP
#
# ------------------------------------------------------------------------------

# If the DUT is configured with port triggers, set this testvar to 'yes'.
#
testvar portTriggers          no

# The port trigger timeout. This timeout is the number of seconds the router 
# will wait before closing an inbound port mapping that has been idle. If the 
# router does not close inbound port mappings after they are created, set this 
# value to 0.
#
testvar portTriggerTimeout    0

# A delay can be added between the verification of each port trigger. The delay 
# is configured in milliseconds.
#
# testvar portTriggerDelay      0

# A delay can also be added between the verification of each open WAN port for 
# each port trigger. The delay is configured in milliseconds.
#
# testvar portTriggerOpenDelay  0


#
# -- Port Trigger Examples
#

testvar triggerName1          net2phone-1
testvar triggerPort1          6801
testvar triggerType1          udp
testvar triggerPublic1        30000
testvar triggerPublicType1    both

# testvar triggerName2          GNUtelle
# testvar triggerPort2          6346
# testvar triggerType2          tcp
# testvar triggerPublic2        6346
# testvar triggerPublicType2    udp

# testvar triggerName3          QuickTime-4-Server
# testvar triggerPort3          6970
# testvar triggerType3          tcp
# testvar triggerPublic3        6970-7000
# testvar triggerPublicType3    udp





# ------------------------------------------------------------------------------
#
# SECTION: APPLICATION LAYER GATEWAY SETUP
#
# ------------------------------------------------------------------------------


#
# -- H.323 ALG Support (NetMeeting)
#

testvar supportsH323AlgOutbound no
testvar supportsH323AlgInbound no

# This is the IP address of a host on the LAN that should receive any incoming 
# H.323 calls. This host will use a static IP configuration. This address should
# not conflict with the DHCP address range.
#
testvar inboundH323Host       192.168.1.220


#
# -- MSN Messenger ALG Support
#

testvar supportsMsnAlg        no

# Non-standard MSN server ports may be configured for the Notification server 
# and the SwitchBoard server. The default is port 1863.
#
# testvar msnNotificationServerPort 1863
# testvar msnSwitchBoardServerPort 1863
#


#
# -- RTSP ALG Support
#

testvar supportsRtspAlg       no

# The testvar rtspTeardownDelay can be used to adjust the amount of time between
# the RTSP TEARDOWN and the verification of the port mappings. It defaults to 5 
# seconds.
#
# testvar rtspTeardownDelay   5
#


#
# -- SIP ALG Support
#

# If the router supports a SIP ALG or Proxy through NAT, configure the testvar 
# supportsSipAlg to yes. Set to no otherwise.
#
testvar supportsSipAlg        yes

# The amount of time to wait for an RTP port mapping to be deleted after a SIP 
# call has ended can be configured using testvar sipCallTeardownDelay. If the 
# ALG uses the default UDP traffic timeout, this value should be configured to 
# the same the timeout as the UDP timeout (see the testvar natUdpTimeout).
#
testvar sipCallTeardownDelay  5

# The maximum number of outbound and inbound SIP calls to attempt.
#
testvar sipMaxOutboundCalls   10
testvar sipMaxInboundCalls    10

# The rate of SIP call establishment can be slowed down by configuring the
# testvar sipCallPacing to a number of milliseconds to delay before establishing
# a new SIP call.
#
# testvar sipCallPacing         0

# The duration of the SIP scaling tests can be modified by configuring the
# testvar sipScaleRunTime to the number of seconds to run the test. The default 
# value is 30 seconds.
#
# testvar sipScaleRunTime       30

# To limit the number of SIP user names that CDRouter will create, set the 
# testvar sipMaxUserNames to the limit value. By default, CDRouter will create a
# unique name or phone number for each test case. Some routers with SIP proxy 
# support limit the number of unique users that can be registered.
#
# testvar sipMaxUserNames       10


#
# -- FTP ALG Configuration Options
#

# This is the amount of time in seconds to wait before verifying that any 
# inbound TCP ports opened by FTP have been closed by the router once the FTP 
# control session is closed.
#
testvar ftpPortTimeout        80



# ------------------------------------------------------------------------------
#
# SECTION: VIRTUAL SERVICES SETUP (TCP AND UDP)
#
# ------------------------------------------------------------------------------


#
# -- TCP Virtual Service Configuration Options
#

# If the DUT supports TCP virtual services, also known as port mapping rules,
# set this testvar to 'yes'.If set to 'yes' CDRouter will test each virtual 
# service configured using the virtualTcpService* entries below.
#
testvar virtualTcpServices    no

# The virtual service WAN translation type. This testvar is used to 
# configure the expected NAT translation of the IP source address for inbound 
# packets that are using a virtual service. The following values are accepted:
#
#  none   - no translation of the IP source is done on incoming packets (default)
#  public - the IP source address is translated to router's WAN IP address
#  private- the IP source address is translated to the router's LAN IP address   
#
# The default value is none.
#
testvar virtualWANTransType   none

# The virtual service LAN translation type. This testvar  is used to configure 
# the expected NAT translation of the IP source address for packets originating 
# on the LAN that are using a virtual service. The following values are accepted
#
#  public - the IP source address is translated to router's WAN IP address
#  private- the IP source address is translated to the router's LAN IP address   
#
# The default value is public.
#
testvar virtualLANTransType   public

# For each virtual TCP and UDP service, you may specify a different port number 
# on the LAN. By default, the port number on the LAN is the same as the WAN and 
# does not need to be configured.
#
# testvar virtualTcpServiceLanPort1   876
# testvar virtualUdpServiceLanPort1   876
#


#
# -- TCP Virtual Service Examples
#

testvar virtualTcpServicePort1 21
testvar virtualTcpServiceHost1 192.168.1.200
testvar virtualTcpServiceName1 ftp
testvar virtualTcpServiceLanPort1 21

# testvar virtualTcpServicePort2 23
# testvar virtualTcpServiceHost2 192.168.1.201
# testvar virtualTcpServiceName2 telnet
# testvar virtualTcpServiceLanPort2 23

# testvar virtualTcpServicePort3 25
# testvar virtualTcpServiceHost3 192.168.1.202
# testvar virtualTcpServiceName3 smtp
# testvar virtualTcpServiceLanPort3 25

# testvar virtualTcpServicePort4 79
# testvar virtualTcpServiceHost4 192.168.1.205
# testvar virtualTcpServiceName4 finger
# testvar virtualTcpServiceLanPort4 79



#
# -- UDP Virtual Service Configuration Options
#

# If the DUT supports UDP virtual services, also known as port mapping rules,
# set this testvar to 'yes'.If set to 'yes' CDRouter will test each virtual 
# service configured using the virtualUdpService* entries below.
#
testvar virtualUdpServices    no


#
# -- UDP Virtual Service Examples
#

testvar virtualUdpServicePort1 53
testvar virtualUdpServiceHost1 192.168.1.203
testvar virtualUdpServiceName1 dns
testvar virtualUdpServiceLanPort1 53

# testvar virtualUdpServicePort2 69
# testvar virtualUdpServiceHost2 192.168.1.204
# testvar virtualUdpServiceName2 tftp
