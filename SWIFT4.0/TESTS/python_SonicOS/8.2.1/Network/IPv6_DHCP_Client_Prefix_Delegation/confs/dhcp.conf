# ------------------------------------------------------------------------------
#
# SECTION: IPv6 SETUP
#
# ------------------------------------------------------------------------------

# Uncomment to enable IPv6 support within CDRouter.
#
 testvar supportsIPv6          yes


#
# -- IPv6 WAN Configuration
#

# The DUT's IPv6 WAN mode. Supported modes are 6to4, 6rd, DHCP, static, PPPoE, 
# autoconf, and none.
#
testvar ipv6WanMode           DHCP

# For DHCP and static IPv6 WAN modes, the WAN side IPv6 addresses must be 
# configured. The ipv6WanIspIp represents the IPv6 address of the ISP's
# next-hop gateway simulated by CDRouter on the WAN. The ipv6WanIspAssignIp is 
# the IPv6 address of the DUT's WAN interface. This address can be statically 
# configured or assigned by CDRouter via DHCPv6. The ipv6WanIspNextIp testvar 
# specifies a free address on the ISP's WAN network which is used during 
# renumbering tests. The prefix length used on the WAN is specified by the 
# testvar ipv6WanIspPrefixLen.
# 
# When PPPoE is enabled on the WAN, CDRouter supports three different addressing 
# configurations: DHCPv6 for address and/or prefix assignment, or manual 
# configuration of a static IPv6 address on the LAN. To enable DHCPv6 in PPPoE 
# mode, set the testvars dhcpv6WanEnableNA and/or dhcpv6WanEnablePD to yes and 
# specify the addresses and prefixes CDRouter's DHCPv6 server should provide. 
# If DHCPv6 is not used for address and/or prefix assignment, please specify the
# DUT's LAN's IPv6 address using the testvar ipv6LanIp. 
#
# Note that CDRouter supports PPPoE for both IPv4 and IPv6 WAN connection modes in
# a single session only. As a result, both IPCP and IPv6CP must occur in the same 
# session if PPPoE is chosen for both IPv4 and IPv6. A single PPPoE username and 
# password must be configured for both IPv4 and IPv6 using the testvars pppoeUser 
# and pppoePassword, respectively.
#
# For autoconf on the WAN, only the testvars ipv6WanIspIp and 
# ipv6WanIspPrefixLen need be specified. CDRouter will advertise the prefix
# specified by these testvars in Router Advertisements on the WAN.
#
testvar ipv6WanIspIp          3001::2 
testvar ipv6WanIspAssignIp    3001::1
testvar ipv6WanIspNextIp      3001::3
testvar ipv6WanIspPrefixLen   64 

# For 6to4 and 6rd WAN modes the IPv4 address of the relay server must be 
# configured. 6to4 normally uses a well known anycast address of 192.88.99.1, 
# whereas 6rd can use any relay server address.
#
testvar ipv6RelayServer       192.88.99.1

# For 6rd WAN mode the 6rd prefix, prefix length, and IPv4 mask length must be 
# configured. The 6rd prefix is specified as a 16 octet IPv6 address. The 6rd 
# prefix length specifies the length of the 6rd prefix and must be an integer 
# value between 1 and 128. The IPv4 mask length specifies the number of 
# high-order bits that are identical across all IPv4 addresses within the 
# specified 6rd domain, and must be an integer value between 0 and 32. These 
# testvars determine the 6rd delegated prefix which, along with the DUT's LAN 
# interface ID, can be used to determine the DUT's LAN side global IPv6 address. 
#
# testvar ipv6rdPrefix          2010:1234::
# testvar ipv6rdPrefixLen       32
# testvar ipv6rdIPv4MaskLen     0
# testvar ipv6rdDHCPv4Option    yes

# CDRouter can be configured to announce the IPv6 DNS servers and domain name
# using RFC 6106 RDNSS and DNSSL options, respectively, in router 
# advertisements sent on the WAN. The testvar wanDomainName will be used to
# populate the DNSSL option.
#
# testvar ipv6WanRDNSS          no
# testvar ipv6WanDNSSL          no


#
# -- WAN-Side DHCPv6 Server Configuration
#

# CDRouter's DHCPv6 server can be configured to provide an IPv6 address in 
# addition to a prefix when the ipv6WanMode is set to PPPoE. The testvar 
# dhcpv6WanEnableNA should be set to yes to configure CDRouter's DHCPv6 
# server on the WAN to respond to both IA_NA and IA_PD requests from the 
# DUT when the ipv6WanMode is set to PPPoE. The testvars ipv6WanIspIp, 
# ipv6WanIspAssignIp, ipv6WanIspNextIp, and ipv6WanIspPrefixLen must all be 
# configured if DHCPv6 is enabled for PPPoE address resolution on the WAN.
# This testvar is only used if the ipv6WanMode is set to PPPoE.
#
# testvar dhcpv6WanEnableNA     no

# The testvars dhcpv6IAValidLifetime and dhcpv6IAPreferredLifetime define the
# Valid and Preferred Lifetimes, in seconds, utilized by CDRouter's DHCPv6
# server on the WAN. CDRouter's DHCPv6 server will provide these values to 
# the DUT's DHCPv6 client on the WAN. To return an infinite lifetime to the 
# WAN client, the keyword "infinite" can be specified. If an infinite lifetime 
# is used, all tests that require the WAN client to renew or rebind will be 
# skipped. 
#
# The Valid Lifetime must be greater than or equal to the Preferred Lifetime.
#
testvar dhcpv6IAValidLifetime          30
testvar dhcpv6IAPreferredLifetime      30

# The DUID format utilized by CDRouter's DHCPv6 server and clients can be
# specified as Type 1 (DUID-LLT), Type 2 (DUID-EN), or Type 3 (DUID-LL) as
# defined in IETF RFC 3315.
#
# testvar dhcpv6DuidType        1

# CDRouter's DHCPv6 server can be configured to provide extra DHCPv6  options
# to the WAN DHCPv6 client. Up to 255 additional DHCP options can be
# configured. Each DHCPv6 option is configured using two testvar entries for
# the DHCP option code and raw hex data for the option. The DHCP option
# data must be converted into the raw ascii hex format. NOTE: You do not
# need to include the total option length in the data portion since this
# will be computed automatically. See the user's guide for more examples.
#
# Example, to add DHCP option 69 and DHCP option 71
#
# testvar dhcpv6ServerOptionCode1  69
# testvar dhcpv6ServerOptionData1  04040404
# testvar dhcpv6ServerOptionCode2  71
# testvar dhcpv6ServerOptionData2  0404040504040406


#
# -- WAN-Side DHCPv6 Prefix Delegation Configuration
#

# DHCPv6 prefix delegation can be enabled when the ipv6WanMode is set to static,
# DHCP, or autoconf. The prefix and prefix length provided by CDRouter's DHCPv6 
# server on the WAN are specified by the testvars dhcpv6WanAssignPrefix and
# dhcpv6WanAssignPrefixLen. The testvar dhcpv6WanAssignNextPrefix specifies 
# a free prefix on the WAN used for renumbering tests. The testvar 
# dhcpv6PDLatency defines the amount of time, in seconds, it takes the DUT
# to update its LAN side IPv6 settings when a new IPv6 prefix is learned on the
# WAN.
#
 testvar dhcpv6WanEnablePD              yes 
 testvar dhcpv6WanAssignPrefix          3001:dddd::
 testvar dhcpv6WanAssignNextPrefix      3001:ddde::
 testvar dhcpv6WanAssignPrefixLen       48 
 testvar dhcpv6PDLatency                30


#
# -- IPv6 LAN Configuration
#

# The IPv6 addressing mode used by LAN clients. Supported modes are "autoconf", 
# "DHCP", "router", and "none". If DHCP is used on the LAN, the DHCPv6 pool 
# should be on the same network as the DUT's LAN IPv6 address.
#
# The router option is used in test scenarios where the DUT is not a gateway, 
# or does not support address provisioning for LAN clients via autoconf or DHCP.
# In router mode CDRouter will automatically transmit Router Advertisements on 
# the LAN and advertise a global IPv6 prefix based on the prefix portion of the 
# testvar ipv6LanIp. CDRouter will also configure its primary LAN interface with
# an IPv6 address based on the Router Advertisements it sends. The most common 
# test scenario for router mode is testing a standalone storage device.
#
testvar ipv6lanmode           none

# The DUT's expected LAN IPv6 address and prefix length. The prefix length must 
# be an integer value between 8 and 64. Note that the keyword "%eui64%" can be 
# used for the host ID portion of this address. When "%eui64%" is used, CDRouter
# will automatically calculate the expected host ID portion of the DUT's LAN 
# IPv6 address based on the EUI64 representation of its LAN MAC address. For 
# IPv6 WAN modes where the prefix is deterministic, such as "6to4" or "6rd", or 
# when DHCPv6 prefix delegation is enabled, the prefix portion of this address 
# may be ommitted.    
#
# Examples:
# 
# testvar ipv6LanIp ::%eui64%
# testvar ipv6LanIp 2007::1
#
testvar ipv6LanIp             2004::1
testvar ipv6LanPrefixLen      64

# The number of IPv6 LAN clients to create during the scaling module. If the 
# testvar  is set to "dhcp", the DHCPv6 client pool will be used to 
# determine the maximum number of LAN clients to create during the 
# scaling-v6.tcl test module if the pool size is less than ipv6MaxLanClients. 
# Alternatively, if the DHCPv6 pool size is greater than ipv6MaxLanClients, the
# number of LAN clients created during the scaling-v6.tcl test module will be 
# capped at ipv6MaxLanClients.

# The maximum number of clients that can be created during the scaling-v6.tcl 
# test module is 512.
#
testvar ipv6MaxLanClients     10

# The maximum expected Router Advertisement interval used by the DUT.
#
testvar ipv6RAInterval        300

# CDRouter's Router Advertisement interval can also be controlled. When CDRouter
# is sending Router Advertisements on the WAN or LAN, the RA interval can be 
# controlled using testvar ipv6RASendInterval. If set to 0, CDRouter will not 
# send regular Router Advertisements.
#
testvar ipv6RASendInterval    10

# When 6ot4, 6rd, or DHCPv6 prefix delegation are used on the WAN, the subnet ID
# portion the DUT's LAN IPv6 prefix must be specified. In 6to4 terminology the 
# subnet ID is referred to as the SLA ID and is fixed at 16 bits. As a result, 
# this parameter should be four or less hex characters when 6to4 is used. In 6rd
# and DHCPv6-PD the subnet ID field can be variable length.   
#
testvar ipv6LanSubnetId       ffff

# The DHCPv6 client timeout can be used to control the behavior of the DHCPv6
# client on the LAN side. Normally, this timeout should not be modified. 
# If you are testing a slow DHCPv6 server, you may need to increase this 
# timeout. The timeout value is in seconds.
#
# testvar dhcpv6ClientTimeout   5

# When running DHCPv6 on the LAN, the expected DHCP pool range must be 
# configured.  
#
testvar ipv6DhcpClientStart   ::2
testvar ipv6DhcpClientEnd     ::1F

# You can exclude specific IPv6 addresses from the DHCPv6 pool range configured 
# above. The testvar ipv6DhcpClientExclude is used to configure a list of IPv6 
# addresses that should be excluded. These IPv6 addresses must be within the 
# DHCPv6 pool range.
#
# testvar ipv6DhcpClientExclude "::3 ::7"
#

# This testvar specifies whether or not the DUT supports DHCPv6 option 14 
# (Rapid Commit). The Rapid Commit test case in the DHCPv6 server test
# module will only be executed if Rapid Commit functionality is supported.
#
testvar dhcpv6RapidCommit     yes

# The DHCPv6 client can be configured to request extra DHCPv6 options from the
# server. 
#
# Example, to request DHCPv6 options 21 and 22 from the server
#                             
# testvar dhcpv6ClientOptionRequest "21 22"

# The DHCPv6 client can also be configured with up to 10 additional options.
#
# Example, to include the FQDN option (39) with the domain name 'qacafe.com'
#
# testvar dhcpv6ClientOptionCode1  39
# testvar dhcpv6ClientOptionData1  000671616361666503636f6d00


#
# -- IPv6 DNS Configuration
#

# This testvar specifies whether or not the DUT supports IPv6 DNS relay 
# functionality. This testvar should be enabled if the DUT is configured to 
# relay the IPv6 DNS servers learned on the WAN side to clients on the LAN via 
# DHCPv6 options or the Neighbor Discovery RDNSS option. This testvar should be 
# disabled if the DUT announces its LAN side IPv6 address as the DNS server to 
# all clients on the LAN.
# 
testvar ipv6DNStoLAN          yes

# The IPv6 address of the DNS servers created by CDRouter on the WAN. These DNS 
# servers will be passed in option 23 (DNS Recursive Name Server) defined in RFC
# 3646 to the DUT's DHCPv6 client on the WAN by CDRouter's DHCPv6 server. 
# Likewise, CDRouter's DHCPv6 server will also provide the domain name 
# specified by the testvar "wanDomainName" in option 24 (Domain Search List). 
#
testvar ipv6WanDnsServer      3001:51a:cafe::2
testvar ipv6WanBackupDnsServer 3001:51a:cafe::3

# These testvars specify whether or not the DUT supports NDP Router 
# Advertisement option 25 (Recursive DNS Server) or 31 (DNS Search List) as 
# defined in RFC 6106.
#
testvar ipv6RdnssSupport      yes
testvar ipv6DnsslSupport      yes


#
# -- IPv6 General Purpose Network Configuration
#

# The address of an initial IPv6 host on the WAN.
#
testvar ipv6RemoteHost        3001:051a:cafe::1

# A range of free IPv6 network addresses to use during test cases. This range of
# addresses should not conflict with any other configured addresses and should
# not be within the designated 6to4 prefix range of 2002::/16. The prefix length
# must be an integer between 8 and 64.
#
testvar ipv6FreeNetworkStart  3001:cafe:1::
testvar ipv6FreeNetworkPrefixLen 64
testvar ipv6FreeNetworkStop   3001:ffff:ffff::

# Free IPv6 multicast addresses to use for multicast testing
#
testvar ipv6MulticastPoolStart ff0e::1
testvar ipv6MulticastPoolStop ff0e:ffff::


#
# -- IPv6 Firewall Configuration
#

# By default CDRouter assumes that all ports on the IPv6 firewall are operating
# in stealth mode. If the DUT is expected to close specific IPv6 TCP or UDP 
# ports on the WAN, you may configure a list of closed ports. These ports will 
# be verified during the port scanning tests. Ranges are also supported by using a
# hypen, such as 100-102, which is identical to listing "100 101 102".  Likewise, 
# you may also configure a list of open IPv6 TCP or UDP ports on the router. To 
# configure the port scan range, edit the testvars portScanStart and portScanStop.
#
# Note that the special keyword all may be used for non-stealth devices that 
# report all TCP or UDP ports as closed.
#
# testvar ipv6FirewallTcpOpenPorts "22 443 3000-3009"
# testvar ipv6FirewallTcpClosedPorts "2323 80"
#
# testvar ipv6FirewallUdpOpenPorts 1234
# testvar ipv6FirewallUdpClosedPorts 113
#

# Set to 'yes' or 'no' if the device supports responding to ICMPv6 Pings 
# on the WAN
#
testvar ipv6WanPingRespond    yes

# ------------------------------------------------------------------------------
#
# SECTION: IPv6 NTP SETUP
#
# ------------------------------------------------------------------------------

# CDRouter can provide up to two IPv6 NTP timeservers on the WAN interface. To
# configure a NTP timeserver, use the ipv6NtpServer1 and ipv6NtpServer2 testvars 
# to configure an IPv6 address for each server. The IPv6 addresses should not be 
# the same as any other network elements such as the ipv6RemoteHost or 
# ipv6WanIspIp.
#
# The NTP servers can also be mapped to specific DNS names using the 
# ipv6NtpServerName1 and ipv6NtpServerName2 testvars.
#
testvar ipv6NtpServer1        4321::23
testvar ipv6NtpServerName1    time.nist.gov

testvar ipv6NtpServer2        4321::24
testvar ipv6NtpServerName2    time.foo.com


# ------------------------------------------------------------------------------
#
# SECTION: IPv6 MULTICAST SETUP
#
# ------------------------------------------------------------------------------

# If the DUT supports IPv6 multicast forwarding or proxy functionality, set this
# testvar to 'yes' to enable multicast support within CDRouter.
#
testvar supportsIPv6Multicast yes

# Some CPE devices can only receive multicast on the LAN and can not forward 
# multicast outbound through the WAN interface. If the device does not 
# support outbound multicast, the testvar supportsIPv6MulticastOut can be 
# configured to no. The default is yes.
#
# testvar supportsIPv6MulticastOut no
#

# The MLD version for all CDRouter LAN clients is configured using the 
# testvar mldVersion. The testvar mldVersion is also used to configure
# the MLD version used by CDRouter's WAN interface.
#
# The default MLD version is 1. Version 2 may also be configured. Some 
# tests require MLDv2.
#
# For MLDv1:
# testvar mldVersion 1
#
# For MLDv2:
# testvar mldVersion 2
#

# The maximum number of MLD groups that are supported on the LAN interface
#
testvar mldMaxGroups          64

# The IPv6 multicast cache timeout is used to specify a delay after a host 
# leaves a group before forwarding should stop. Some devices implement a cache 
# function that allows packets to be forwarded for a few seconds after the last 
# host leaves a multicast group.
#
testvar ipv6MulticastCacheTimeout 10


#
# -- MLD Timers
#

# RFC 2710 and RFC 3810 define the following parameters for MLD 
# implementations:
#
# testvar mldQueryInterval          125
# testvar mldRobustnessVariable     2
# testvar mldQueryResponseInterval  10 
#


#
# -- MLD Fast Leave
#

# When MLD Fast Leave is enabled, no group specific MLD query is sent when a 
# host leaves a group and its the only host on a port. Normally, MLD Fast leave
# is used when MLD Snooping is also enabled.
#
# testvar mldFastLeave no
#


#
# -- IPv6 IPTV Configuration Options
#

# The IPv6 multicast test module contains IPTV specific channel change tests. 
# There are a few configuration options available:
#
# The number of channels to change:
#
# testvar ipv6IptvChannelRange 200
#
# The amount of delay in milliseconds between each channel change:
#
# testvar ipv6IptvChannelChangeDelay 200
#
# Stop the channel change test after a specific number of failures:
#
# testvar ipv6IptvMaxFailures 10
#


# ------------------------------------------------------------------------------
#
# SECTION: STORAGE SETUP
#
# ------------------------------------------------------------------------------

# Uncomment to enable Storage support within CDRouter.
#
# testvar supportsStorage       yes


#
# -- SMB Configuration for IPv4 and IPv6
#

# This testvar indicates whether or not the DUT supports SMB/CIFS. If enabled,
# up to 10 unique SMB user configurations can be defined.
#
testvar supportsStorageSmb    yes

# CDRouter currently supports up to 10 unique SMB user configurations. Each
# user configuration must be defined a separate "smbuser" testvar group with the
# following configuration options:
#
# server        This testvar specifies the name or IP address of the SMB server
#               being tested. CDRouter supports both integrated and standalone
#               SMB server configurations and will attempt to resolve the IP of
#               the server via NetBIOS or DNS at the start of each test.  
#                      
# share         This testvar defines a specific share on the SMB server that 
#               will be used as the root location for all storage tests.  
#               CDRouter will attempt to connect to this share at the start of  
#               each test.
# 
# folder        This testvar specifies an optional folder within the share. If 
#               specified, CDRouter will descend into this folder and start all
#               SMB storage tests here.
#
# guest		This testvar specifies whether or not the defined share is
#               configured for guest access. If set to "no", the share will be
#               accessed using the username and password for the SMB user under
#               test. If set to "yes", the username and password testvars may be
#               left empty. Guest access to specific shares is also possible for
#               configured users.  
#              
# user          This testvar specifies the username for the SMB user under test.
# 
# password      This testvar specifies the password for the SMB user under test.
# 
# permission    This testvar specifies the permission for the SMB user under 
#               test. This testvar can be either "ReadWrite" or "ReadOnly".
#

# Examples:
#
# testvar_group smbuser1 {   
#   testvar server     MyNAS
#   testvar share      data
#   testvar folder     home/qacafe
#   testvar guest      no
#   testvar user       qacafe  
#   testvar password   qacafe123
#   testvar permission ReadWrite
# }
#
# testvar_group smbuser2 {   
#   testvar server     MyNAS
#   testvar share      pictures
#   testvar user       user2  
#   testvar password   qacafe123
#   testvar permission ReadOnly
# }
#
# testvar_group smbuser3 {   
#   testvar server     MyNAS
#   testvar share      public
#   testvar guest      yes
#   testvar user         
#   testvar password   
#   testvar permission ReadOnly
# }



# The maximum number of simultaneous SMB sessions supported by the DUT. Values
# between 1 and 20 are supported. If not specified CDRouter defaults to 20.
#
testvar storageSmbMaxSessions 20  

# The timeout for an SMB operation in millseconds. This defaults to 120000 ms or 
# 120 seconds. This can be adjusted based on the size of the files used for 
# upload and download and the expected performance of the storage device.
#
testvar storageSmbTimeout     120000


#
# -- FTP and FTPS Configuration for IPv4 and IPv6
#

# These testvars indicate whether or not the DUT supports FTP and FTPS. If 
# either protocol is enabled, up to 10 unique FTP/FTPS user configurations can 
# be defined.
#
testvar supportsStorageFtp    yes
testvar supportsStorageFtps   yes

# CDRouter currently supports up to 10 unique FTP/FTPS user configurations. Each
# user configuration must be defined a separate "ftpuser" testvar group with the
# following configuration options:
#
# server        This testvar specifies the name or IP address of the FTP server
#               being tested. CDRouter supports both integrated and standalone
#               FTP server configurations and will attempt to resolve the IP of
#               the server via NetBIOS or DNS at the start of each test.  
#                      
# path          This testvar specifies the full path of a directory on the FTP 
#               server. CDRouter will descend into this directory and start all
#               FTP storage tests here.
#              
# user          This testvar specifies the username for the FTP user under test.
# 
# password      This testvar specifies the password for the FTP user under test.
# 
# permission    This testvar specifies the permission for the FTP user under 
#               test. This testvar can be either "ReadWrite" or "ReadOnly".
#

# Examples:
#
# testvar_group ftpuser1 {   
#   testvar server     MyNAS
#   testvar path       /home/qacafe
#   testvar user       qacafe  
#   testvar password   qacafe123
#   testvar permission ReadWrite
# }
#
# testvar_group ftpuser2 {   
#   testvar server     MyNAS
#   testvar path       /home/user2/pictures
#   testvar user       user2  
#   testvar password   qacafe123
#   testvar permission ReadOnly
# }



# The maximum number of simultaneous FTP sessions supported by the DUT. Values
# between 1 and 20 are supported. If not specified CDRouter defaults to 20. 
#
testvar storageFtpMaxSessions 20

# The timeout for an FTP operation in millseconds. This defaults to 120000 ms or 
# 120 seconds. This can be adjusted based on the size of the files used for 
# upload and download and the expected performance of the storage device.
#
testvar storageFtpTimeout     120000


#
# -- Other Storage Configuration Options
#

# The size of files used in storage testing may be 10, 100, or 1000. These
# values represent KBytes. A value of 10 is equivilent to a 10K byte file. If
# a custom size is desired, use the testvar storageUserFilePath to specify
# your own file on the CDRouter host. CDRouter defaults to 10.
#
testvar storageFileSize       10

# By default CDRouter uses pre-built 10, 100, or 1000 KByte files for all upload
# tests. The length of the file used is determined by the testvar 
# storageFileSize and defaults to 10 KB. The storageUserFilePath testvar 
# specifies the full path of a custom file on the local system to use during 
# upload tests instead of the included pre-built files. Specifying a custom file
# allows different file sizes and types to be easily tested. The maximum allowed
# file size is 10 MB.
#
# testvar storageUserFilePath   /tmp/myStorageTestFile

# By default CDRouter will use DNS followed by NetBIOS (IPv4 only) to resolve 
# the IP address of the SMB or FTP server under test. CDRouter can also be 
# configured to use Multicast DNS (mDNS) by setting the testvar useMulticastDNS 
# to "yes". When this testvar is enabled, CDRouter will try mDNS, then DNS, and 
# finally NetBIOS. If all three methods are unsuccessful, CDRouter will try them
# all one more time before aborting the test case.
#
# testvar useMulticastDNS       no



# ------------------------------------------------------------------------------
#
# SECTION: NMAP SETUP
#
# ------------------------------------------------------------------------------

# Nmap is disabled by default. You can enable Nmap tests by setting the 
# testvar supportsNmap to yes.
#
# testvar supportsNmap          no

# The nmapScanTimeout is the amount of time to wait for a Nmap scan to complete.
# If the timeout is reached, the scan will be stopped and the test marked as a 
# FAIL.
#
testvar nmapScanTimeout       600

# The nmapTimingTemplate controls the timeout and retries for each scan. 
# Acceptable values range from 0 to 5 with 5 being the fastest scan.
#
testvar nmapTimingTemplate    5

# ------------------------------------------------------------------------------
#
# SECTION: ADDITIONAL FEATURES SETUP
#
# ------------------------------------------------------------------------------


#
# -- Internal SMTP Server
#

# If enabled, CDRouter has a built-in SMTP server able to receive mail and
# display it during a test run.  If you need to receive emails from a device,
# enable the Internal SMTP server. 
#
# testvar internalSmtpServer           5.5.5.5


#
# -- URL Filtering Configuration Options
#

testvar urlFilterSupported 	"yes"
testvar filtered-urls 		"http://abc.com/yahoo.htm http://www.foo.com/home.htm"
testvar non-filtered-urls 	"http://qacafe.com"


#
# -- Remote Host IP Address
#

# The 'remoteHostIp' address is an address on the WAN side of the network that 
# will be used for verification of LAN->WAN traffic and WAN->LAN traffic. This 
# address should not conflict with the free network address range listed below.
#
testvar remoteHostIp          3.3.3.3


#
# -- General Purpose HTTP Server Configuration Options
#

# The 'httpServerIp' address is an address on the WAN side of the network that 
# will be used for a HTTP server. The HTTP server is a general purpose server 
# intended to serve files needed by the CPE under test in order to be 
# operational. It may also be desirable to setup DNS entries for specific host 
# names that point to this same IP address.
#
# testvar httpServerIp          3.3.3.16
# testvar httpServerPort        80
# testvar httpServerRoot        /tmp
#


#
# -- Free Network Range Configuration Options
#

# The 'free network range' is a range of unused IP addresses on the WAN that are
# used by CDRouter during various test cases.
#
testvar FreeNetworkStart      192.168.201.0
testvar FreeNetworkMask       255.255.255.0
testvar FreeNetworkStop       193.0.0.0


#
# -- TCP MSS Clamping Configuration Options
#

# If the DUT supports MSS Clamping for TCP sessions, configure the expected MSS 
# size. If MSS is not supported or expected, comment out the testvar 
# mssClampingValue.
# 
# You can also set the mssClampingValue to 'default'. CDRouter will
# automatically compute the expected MSS based on the lanMtu setting. If your 
# MSS implementation sets the MSS differently to handle other factors such as IP
# or IPSEC tunnels, you should configure the MSS to match your implementation.
#
# Example values:
#
#  PPPoE 1452
#  DHCP  1460
# 
testvar mssClampingValue      default

# If the device only clamps in the outbound direction or uses different values 
# for each direction, you can adjust the inbound direction using the testvar 
# mssClampingInValue. 
#
# testvar mssClampingInValue 1460
#


#
# -- TCP/UDP Scaling Options
#

# The maximum number of TCP and UDP connections CDRouter will create during the 
# scaling tets.
#
testvar natMaxTcpConns        200
testvar natMaxUdpConns        100


#
# -- Forwaring Test Options
#

# The maximum number of allowed failures during forwarding test cases
#
# testvar forwardingMaxFailures 20



# ------------------------------------------------------------------------------
#
# SECTION: TEST EXECUTION OPTIONS AND AUTO-REBOOT
#
# ------------------------------------------------------------------------------

#
# -- Test Start-up Delay
#

# The startDelay is the amount of time the test suite will wait after the LAN 
# and WAN interfaces have been established. 
#
testvar startDelay            3


#
# -- LAN Start Delay
#

# The lanStartDelay is the amount of time to wait after the WAN side
# connection has been established before starting DHCP clients on the LAN. 
# This option is not used when the WAN is configured with connect-on-demand.
#
testvar lanStartDelay         3


#
# -- Startup Timeout
#

# The startTimeout is the amount of time to wait for each initial service to 
# start at the beginning of a test run. For example, with the default value of 
# 90, CDRouter will wait 90 seconds for the DHCP client to be established and 90
# seconds for the PPPoE connection on the WAN.
#
testvar startTimeout          90


#
# -- Close WAN Connection on Exit
#

# When 'wanCloseOnExit' is set to yes, the PPP connection for PPPoE or PPPoA
# will be closed when the test run has completed. Any DHCP client leases on the 
# LAN will also be released.
#
testvar wanCloseOnExit        yes


#
# -- Automatic Restart and Shutdown of DUT
#

# The 'RestartDut' testvar can be used to automatically execute a script/program 
# that will reset or initialize the router.
#
# This example uses wget to power cycle an iP-415 power strip via its
# web interface. See http://www.dataprobe.com for information on the iP-415.
#
# Please comment out the 'RestartDut' testvar or replace with your own script.
#
 testvar RestartDut            "sleep 1"

# The 'RestartDutDelay' can be used to add an additional delay in seconds after
# the RestartDut command has been executed. The default is 10 seconds.
#
# testvar RestartDutDelay       10

# The 'ShutdownDut' testvar can be used to turn the router off once the test run
# has finished. This example is again based on the iP-415 power strip from
# http://www.dataprobe.com.
#
# testvar ShutdownDut      "wget -q -O /dev/null --http-user=admin --http-passwd=PASS http://192.168.1.6 http://192.168.1.6 http://192.168.1.6/T4 http://192.168.1.6/L"



# ------------------------------------------------------------------------------
#
# SECTION: ADDITIONAL WAN INTERFACE SETUP (CDROUTER MULTIPORT ONLY)
#
# ------------------------------------------------------------------------------

# You may define additional WAN interfaces using the testvar_group entries 
# below. Each WAN interface must be named wan2, wan3, wan4, ..., up to wan64. 
# You can comment out a WAN interface by placing 'IGNORE' before the 
# testvar_group keyword. To enable any of the interfaces below, remove the 
# 'IGNORE' keyword from the beginning of the line.
#

# This testvar specified the number of seconds it takes a WAN interface to 
# failover. The default is 300 seconds.
#
# testvar wanFailoverTimeout 300
#


#
# -- Additional WAN Interface Example Configuration
# 

IGNORE testvar_group wan2 {

   # -- Ethernet WAN
   testvar wanInterface          eth3

   # -- ATM WAN
   # testvar wanAtmInterface     0.0.36
   # testvar wanAtmEncap         PPPoA-VC

   # -- T1/E1 WAN
   # testvar wanT1Interface        wp2chdlc
   # testvar wanT1Encap            PPP

   # -- WAN configuration
   testvar wanIspIp              6.0.0.1
   testvar wanIspAssignIp        6.0.0.2
   testvar wanNatIp              6.0.0.2
   testvar wanIspNextIp          6.0.0.3
   testvar wanIspMask            255.255.255.0
   testvar wanMac                00:0b:0b:00:00:02
   # testvar wanVlanId           100
   # testvar wanVlanPriority     0
   testvar wanDomainName         qacafe.com
   testvar wanDnsServer          2.1.1.1
   testvar wanBackupDnsServer    2.1.1.2
   testvar wanMode               PPPoE

   # -- DHCP configuration
   testvar dhcpLeaseTime         300
   # testvar dhcpServerBroadcast   yes

   # -- PPPoE configuration
   testvar pppoeUser             qacafe2
