   testvar pppoeAcName           qacafe-ac2
   testvar pppoeServiceName      any

   # -- PPPoA configuration
   testvar pppoaUser             qacafe2
   testvar pppoaPassword         qacafe1234

   # -- PPP/T1 configuration
