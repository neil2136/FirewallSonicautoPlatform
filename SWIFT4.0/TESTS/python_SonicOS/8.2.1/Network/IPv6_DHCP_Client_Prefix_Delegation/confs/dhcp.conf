# ------------------------------------------------------------------------------
#
# SECTION: ADDITIONAL LAN INTERFACE SETUP (CDROUTER MULTIPORT ONLY)
#
# ------------------------------------------------------------------------------

# You may define additional LAN interfaces using the testvar_group entries 
# below. Each LAN interface must be named lan2, lan3, lan4, ..., up to lan64. 
# You can comment out a LAN interface by placing 'IGNORE' before the 
# testvar_group keyword.
#
# LAN interfaces may be either wired ethernet or 802.11 wireless interfaces.
#

# To prevent CDRouter from switching between LAN interfaces between each test, 
# configure the testvar useSameLanInterface to yes. By default, CDRouter will 
# switch LAN interfaces between each test so that all configured LAN 
# interfaces are used.
#
# testvar useSameLanInterface yes
#


#
# -- Additional LAN Interface Example Configuration
# 

# Example with additional Ethernet LAN interface:

IGNORE testvar_group lan2 {

   # -- specify the physical interface
   testvar lanInterface       eth3

   # -- configure a different MAC address
   testvar lanMac             00:00:cc:cc:01:02

   # -- mark the interface as ethernet
   testvar lanType            ethernet

}

# Example with additional wireless LAN interface:
#

IGNORE testvar_group lan3 {

   # -- specify the physical interface
   testvar lanInterface       eth4

   # -- mark the interface as 802.11g wireless
   testvar lanType            802.11g

   # -- configure the wireless SSID
   testvar lanSSID            qacafe-ssid

   # -- for WPA-RADIUS/EAPOL
   # testvar lanUseEAPOL        yes

}

# Example for static NAT host. NOTE: Static NAT hosts may use 
# ethernet LAN interfaces that are already in use by another LAN 
# interface. If they share the same physical interface, a unique 
# MAC address must be specified.
#

IGNORE testvar_group lan4 {

   # -- Specify the physical interface
   testvar lanInterface       eth3

   # -- Configure a different MAC address
   testvar lanMac             00:00:cc:cc:01:03

   # -- Mark the interface as ethernet
   testvar lanType            ethernet

   # -- The IP address on the LAN for this static NAT host
   testvar hostIp             192.168.1.203

   # -- the WAN side IP address used for static NAT
   testvar staticNatIp        192.168.200.100

   # -- If the staticNatIp does not have a firewall enabled,
   # the testvar staticNatFirewall may be set to no. By default,
   # the firewall is assumed to be enabled.
   testvar staticNatFirewall  yes

   # -- The static NAT host may have its own NAT mode that
   # is different than the NAT mode for the primary WAN interface. In
   # the case of static NAT, the natMode only refers to the type
   # of filtering that is applied.
   testvar natMode            port-restricted

   #
   # -- Static NAT hosts may have their own firewall, virtual
   # services, and trigger ports.
   #

   # testvar firewallTcpOpenPorts            "22 23"
   # testvar firewallUdpOpenPorts            "22 23"

   # testvar virtualTcpServices              yes	
   # testvar virtualTcpServicePort1          21	
   # testvar virtualTcpServiceHost1          192.168.1.203
   # testvar virtualTcpServiceName1          ftp
   # testvar virtualTcpServiceLanPort1       21

   # testvar virtualUdpServices              yes	
   # testvar virtualUdpServicePort1          69	
   # testvar virtualUdpServiceHost1          192.168.1.203
   # testvar virtualUdpServiceName1          ftp
   # testvar virtualUdpServiceLanPort1       69

   # testvar portTriggers                    no	
   # testvar triggerName1                    net2phone-1
   # testvar triggerPort1                    6801
   # testvar triggerType1                    udp
   # testvar triggerPublic1                  30000
   # testvar triggerPublicType1              both

}









  
