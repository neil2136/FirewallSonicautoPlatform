# dibbler-server.conf for Ubuntu 24
# DHCPv6 Server Configuration

log-level 8
log-mode short
preference 0
iface "eth1" {
    t1 1800
    t2 2700
    prefered-lifetime 3600
    valid-lifetime 7200
    
    # 地址池配置 (使用范围格式)
    class {
        pool 2001:1:2:3::100-2001:1:2:3::254
    }
    
    # 前缀委托配置 (PD)
    pd-class {
        pd-pool 2001:1:2:3::/64
        pd-length 64
    }
    
    # DNS 服务器配置
    option dns-server 2001:1:2:3::1
}
