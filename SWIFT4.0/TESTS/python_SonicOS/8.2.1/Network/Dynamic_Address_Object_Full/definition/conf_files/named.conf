options {

    directory "/var/named"; 
};

zone "." {      

    type hint;

    file "named.ca";

 };

zone "localhost" { 

    type master;

    file "named.local"; 

};

zone "limitFQDN.com" {

    type master;

    file "limitFQDN.com.db";

};

zone "0.0.127.in-addr.arpa"{ 

    type master;

    file "127.0.0.zone";

};

zone "0.0.13.in-addr.arpa" {

    type master;

    file "13.0.0.db";

};
