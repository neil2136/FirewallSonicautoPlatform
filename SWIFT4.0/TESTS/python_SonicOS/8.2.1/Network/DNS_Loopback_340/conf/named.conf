options {

       directory "/var/named";   

          };

        zone "." {      

         type hint;

         file "named.ca";

         };

        zone "localhost" { 

         type master;

         file "named.local"; 

        };

       zone "http.test.com" {

         type master;

         file "http.test.com.zone";

       };

      zone "0.0.127.in-addr.arpa"{ 

          type master;

         file "127.0.0.zone";

      };

     zone "1.1.10.in-addr.arpa" {

          type master;

          file "10.1.1.zone";

      };

