interface eth2{
	AdvSendAdvert on;
        AdvManagedFlag on;
        AdvOtherConfigFlag on;
        MinRtrAdvInterval 10;
	MaxRtrAdvInterval 20;
	MinDelayBetweenRAs 3;	
	AdvDefaultLifetime 100;
	AdvLinkMTU 0;
	AdvDefaultPreference high; 
        prefix 2001:db8:2222:1::0/64
        {
                AdvOnLink on;
                AdvAutonomous on;
                AdvRouterAddr on;
        };
};
interface ppp0{
	AdvSendAdvert on;
        AdvManagedFlag on;
        AdvOtherConfigFlag on;
        MinRtrAdvInterval 10;
	MaxRtrAdvInterval 20;
	MinDelayBetweenRAs 3;
	AdvDefaultLifetime 100;
	AdvLinkMTU 0;
	AdvDefaultPreference high;
        prefix 2001:db8:3333:2::0/64
        {
                AdvOnLink on;
                AdvAutonomous on;
                AdvRouterAddr on;
        };
};
