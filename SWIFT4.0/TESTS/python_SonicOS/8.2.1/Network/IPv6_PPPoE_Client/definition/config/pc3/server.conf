iface "ppp0" {
    t1 1800
    t2 2700
    prefered-lifetime 3600
    valid-lifetime 7200
    class {
        pool 2001:db8:333::0/64
    }
    pd-class {
        pd-pool 2001:db8:3336::0/48
        pd-length 56
    }
    option dns-server 2001:db8::1, 2001:db8::2
    option domain example.com
}