# Automatic Restart of Router
#
# Enter the name of a script/program to run that will reset the the router.
#
# This example uses wget to power cycle an iP-415 power strip via its
# web interface. See http://www.dataprobe.com for information on the iP-415.
#
# Please comment this out or replace with your own script.
