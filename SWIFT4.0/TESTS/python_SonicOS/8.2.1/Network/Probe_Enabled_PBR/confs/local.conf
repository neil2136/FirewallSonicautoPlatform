#
# Additional LAN Interfaces
#
# You may define additional LAN interfaces using the testvar_group 
# entries below. Each LAN interface must be named lan2, lan3, 
# lan4, ..., up to lan64. You can comment out a LAN interface by 
# placing 'IGNORE' before the testvar_group keyword.
#
# LAN interfaces may be either wired ethernet or 802.11 wireless
# interfaces.
#

#
# To prevent CDRouter from switching between LAN interfaces between
# each test, configure the testvar useSameLanInterface to yes. By default,
# CDRouter will switch LAN interfaces between each test so that all
# configured LAN interfaces are used.
#
# testvar useSameLanInterface yes
#

#
# Example additional LAN interface

IGNORE testvar_group lan2 {

   # -- specify the physical interface
   testvar lanInterface       eth4

   # -- configure a different MAC address
   testvar lanMac             00:00:cc:cc:01:02

   # -- mark the interface as ethernet
   testvar lanType            ethernet

}

#
# Example additional wireless LAN interface
#
# NOTE: Remove the 'IGNORE' to enable.
#

IGNORE testvar_group lan3 {

   # -- specify the physical interface
   testvar lanInterface       eth4

   # -- mark the interface as 802.11g wireless
   testvar lanType            802.11g

   # -- configure the wireless SSID
   testvar lanSSID            qacafe-ssid

   # -- for WPA-RADIUS/EAPOL
   # testvar lanUseEAPOL        yes

}








