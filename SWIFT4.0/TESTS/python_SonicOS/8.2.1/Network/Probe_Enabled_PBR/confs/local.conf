#
# Cable/DSL Router Test Suite (MultiPort)
# 
# Test Suite Configuration
#
# Version: 2.6
#
# 2004 QAcafe http://qacafe.com
# support@qacafe.com
#
# Local.conf
#
# This is the main configuration file for the cdrouter test suite. It is used
# to control the behavior of the overall suite and several tests.
#
#

#
# -- LAN side configuration
#
#    The LAN interface should connect to the lan interface on the router 
#
#
testvar lanInterface          eth1

#
# -- LAN interface type
#
#    valid options are:
#           
#    ethernet
#    802.11b
#    802.11a
#    802.11g
#
testvar lanType               ethernet

#
# For wireless LAN interfaces, you can specify the SSID to use. If no
# SSID is specified, the existing SSID of the wireless interface is used.
testvar lanSSID               qa-net

# WPA Encryption:
#
# Newer devices support the 802.11i Wi-Fi Protected Access mode (WPA)
# If you specify a wirelessAuthType you may use WPA enabled devices.
#
#   valid options are:
#
#     WPA-PSK
#     WPA-RADIUS
#
#testvar wirelessAuthType      WPA-PSK

#
# WPA-PSK cipher selection
#
#   valid options are:
#      TKIP
#      AES-CCMP
#
#testvar wpaCipher            TKIP

#
# WPA group key cipher selection
#
# By default, CDRouter will use the same cipher for the group as the
# pairwise key. The testvar wpaGroupCipher may be used to configure a
# group key cipher that is different than the pairwise key cipher.
#
#   valid options are:
#      TKIP
#      AES-CCMP
#
#testvar wpaGroupCipher       TKIP


#
# For WPA encryption you can specify either an ascii passphrase that is 8-63 
# characters long, or a 64-character hexadecimal key. This key must match the
# key entered on the Device.
#
# Examples are:
#
#testvar wpaKey          qacafe123
#testvar wpaKey          8c53b145d4457493967b525e4065fb6d4e2e39597c36c10d4ff7648c515dd6c9


#
# For WEP encryption on wireless LAN interfaces, you can specify either a
# 40 or 128 bit key length. For 40 bit WEP keys, enter 10 hex digits. For
# 128 bit WEP keys, enter 26 hex digits. If no WEP key is specified, the
# existing WEP key (if any) of the wireless interface is used. To disable
# WEP configure the lanWEPKey to 'off'.
#
# Examples:
#
# testvar lanWEPKey           0102030405
# testvar lanWEPKey           0102030405060708090a010203
#
testvar lanWEPKey             off

#
# You can also specify the specific WEP key index if necessary. The default
# WEP key index is 0. Valid WEP key index values are 0 - 3.
#
# testvar lanWEPKeyIndex      0
#

# -- the routers LAN ip address
testvar lanIp                 192.168.168.168

# -- the router LAN network mask
testvar lanMask               255.255.255.0

# -- the MAC address of the LAN address. By default, the real MAC address
#    of the hardware device will be used.
# testvar lanMac                00:0a:0a:00:00:01

# -- The largest LAN IP MTU that can be forwarded by the router. If set to
#    'default', the MTU will be selected dynamically based on the WAN protocol
#    that is running. Otherwise, this value should be set the specific MTU
#    desired.
#
#    The default MTU values in 'default' mode are:
#
#       static      1500
#       DHCP        1500
#       PPPoA       1500
#       PPPoE       1492
#       PPTP        1460
#       PPP/T1      1500    
#
testvar lanMtu                default

# -- 802.1q VLAN
#
#    If the LAN interface is part of an 802.1q VLAN, configure the VLAN
#    Id using the testvar lanVlanId. You can also change the default
#    802.1p priority used on the LAN interface by configuring the testvar
#    lanVlanPriority. Valid priority values are 0 - 7.
# 
# testvar lanVlanId           100
# testvar lanVlanPriority     0
#

#
# -- WAN side configuration
#
#    The WAN interface should connect to the wan interface on the router, DSLAM
#    device, or WAN side of the network.
#
#

testvar wanInterface          eth2

#
# For ATM PVC interfaces:
#
# To configure an ATM PVC interface on the WAN, use wanAtmInterface. The format
# for an ATM interface name is:
#
#  <ATM card number>.<VPI>.<VCI>
#
# If you only have a single ATM card in your system, the card number is 0.
#
# 
# testvar wanAtmInterface     0.0.35
# testvar wanAtmEncap         PPPoA-VC
#
# You must also configure wanAtmEncap to one of the supported ATM 
# Encapsulation types:
#
#    1483Bridged-LLC          RFC1483/2684 Bridged LLC Encapsulation 
#    1483Bridged-VC           RFC1483/2684 Bridged VC Based Multiplexing
#    1483Routed-LLC           RFC1483/2684 Routed LLC Encapsulation 
#    1483Routed-VC            RFC1483/2684 Routed VC Based Multiplexing
#    PPPoA-LLC                RFC2364 LLC Encapsulated PPP
#    PPPoA-VC                 RFC2364 VC Multiplexed PPP
#

#
# For T1 interfaces:
#
# To configure a T1 interface on the WAN, set the wanT1Interface testvar to
# the device name for the T1 interface. For help on configuring
# the T1 device, please see the user guide. 
#
# The following encapsulations are supported on the T1/HDLC interface:
#
#    FrameRelay
#    PPP
#
# Example for Frame Relay configuration:
#
# testvar wanT1Interface       wp1chdlc
# testvar wanT1Encap           FrameRelay
# testvar wanT1FrameRelayDlci  16
#
# Example for PPP configuration:
# 
# testvar wanT1Interface       wp1chdlc
# testvar wanT1Encap           PPP
#

# -- the 'ISPs' ip address
testvar wanIspIp              192.168.120.10

# -- the address the ISP will assign to the Cable/DSL router
testvar wanIspAssignIp        192.168.120.20

# -- the address the router will use as its NAT source address. NOTE: This is
# normally the same at the 'wanIspAssignIp' address above. However, a 
# different address can be specified to support other test topologies.
testvar wanNatIp              192.168.120.20

# -- A free address used for renumbering tests. This address should be on
# the same  IP network than wanIspIp.
testvar wanIspNextIp          192.168.120.254

# -- the network mask of the WAN interface
testvar wanIspMask            255.255.255.0

# -- the MAC address of the WAN address. Comment this out to use the real
# MAC address of the wanInterface device.
#testvar wanMac                00:0b:0b:00:00:01


# -- the domain name assigned by the ISP
testvar wanDomainName         qacafe.com

# -- the DNS server assigned by the ISP
testvar wanDnsServer          1.1.1.1
testvar wanBackupDnsServer    1.1.1.2

# 
#  Dynamic DNS Service support
#
#  Some routers support automatically updating with the DynDNS.org
#  service provided by Dynamic Networks Systems, Inc.
#  

# -- Enable the DynDNS tests
testvar supportsDynDns        no

#
# -- The WAN IP Address for the service. CDRouter will create a 
# DynDNS server at this IP address. 
testvar dynDnsServerIp        66.37.215.49

#
# -- The DynDNS Transport Protocol. The default is http. However, you
# may also specific https.
#
# testvar dynDnsTransport http
#


# 
# Router DynDNS Client Configuration
#   
#   Note: Routers may or may not let you configure each of these options.
#   If the device being tested does not support a particular option,
#   leave it commented out.
#
testvar dynDnsHostname        test.domain.com
testvar dynDnsUsername        qacafe
testvar dynDnsPassword        qacafe123

# -- Some less frequently available options
#
#  testvar dynDnsSystem       dyndns
#  testvar dynDnsMx       mail.domain.com
#  testvar dynDnsBackMx       no
#  testvar dynDnsWildcard     off
#
# -- dyndns client user-agent. This should match the value specified by the client 
# in the HTTP headers during a DynDns update.
#
testvar dynDnsAgent           RAS/1.1

# -- additional time to wait for DynDNS updates AFTER the WAN is established
#  Enable this timeout if tests are failing because the router hasn't updated yet.
#
testvar dynDnsWait            30
#

# --  DynDNS error codes should disable the DynDNS service on the device, 
#     forcing any subsequent tests to fail. 
#
# Setting this to 'yes' here will allow you to run the error handling tests 
# which would not normally run.  Note that this will disable the regular DynDNS functioning
# tests.
#
# testvar testDynDnsErrorCode   yes
#
# -- error code for the server to return when doing the Error handling test. The
# following error codes are available:
#
#   badsys 
#   badagent 
#   badauth 
#   !donator 
#   nochg 
#   notfqdn 
#   nohost 
#   !yours 
#   abuse 
#   numhost 
#   dnserr
#
# testvar dynDnsServerReturn    !yours


# -- the WAN configuration mode

#
# the following wan modes are supported
#
# static   The router has a statically configured WAN IP address. The addres
#          should be configured under 'wanIspAssignIp'. None of the
#          DHCP or renumbering tests will be run.
#
# DHCP     The router runs a DHCP client on the WAN interface.
#
# PPPoE    The router runs a PPPoE client on the WAN interface.
#
# PPPoA    The router runs a PPPoA client on the WAN interface.
#
# PPTP     The router runs a PPTP client on the WAN interface.
#
# PPP/T1   The router runs a PPP client on the WAN T1/E1 interface.
#

testvar wanMode               static

#
# -- DHCP server configuration
#
# Note: This timeout should be at least 2 * retransmission timeout of the
# client. Otherwise, the lease will actually timeout during any retransmission
# tests. The lease should be long enough to allow the client to deal with
# timeouts when it is trying to renew/rebind. To return an infinite DHCP
# lease to the WAN client, set this to 'infinite'. If the lease is 'infinite',
# tests the require the WAN client to renew will be skipped.
#

testvar dhcpLeaseTime         300

#
# DHCP server broadcast mode
# 
# When 'dhcpServerBroadcast' is set to yes, the DHCP server will sent all
# DHCP responses to the broadcast address 255.255.255.255. The default 
# behavior is to send all DHCP responses to the unicast address being
# assigned.
#
# testvar dhcpServerBroadcast  yes
#


#
# -- DHCP client configuration
#
# The DHCP client timeout can be used to control the behavior of the DHCP
# client on the LAN side. Normally, this timeout should not be modified. If
# you are testing a slow DHCP server, you may need to increase this timeout.
# The timeout value is in seconds.
#
# testvar dhcpClientTimeout   5
#

#
# dhcpConnectOnDemand
#
# If the DHCP client on the WAN interfaces does not attempt to connect until
# traffic is forwarded on the LAN, set dhcpConnectOnDemand to 'yes'. Otherwise,
# set dhcpConnectOnDemand to no. NOTE: Most dhcp clients on the WAN interface
# will attempt to discover the DHCP server after reboot.
#

testvar dhcpConnectOnDemand   no

#
# -- DHCP client configuration
#
# NOTE: This range should not include the server's IP address on the LAN side
#

# -- the router should assign IP addresses in this range
testvar dhcpClientStart       192.168.168.1
testvar dhcpClientEnd         192.168.168.167

#
# You can exclude specific IPv4 addresses from the DHCP pool range
# configured above. The testvar dhcpClientExclude is used to
# configure a list of IPv4 addresses that should be excluded. These
# IPv4 addresses must be within the DHCP pool range.
#
# testvar dhcpClientExclude "192.168.1.47 192.168.1.48"
#

# -- DHCP pacing configuration to slow down the DHCP scaling tests. These 
# testvars can be use to control the speed at which DHCP clients are created 
# and released. Some routers are not able to process large numbers of DHCP 
# protocol events if they happen too quickly.
#
# The delays are in milli-seconds.
#
# To add a delay in between the creation of each DHCP client:
# testvar dhcpCreateDelay     0
#
# To add a delay in between the release of each DHCP client lease:
# testvar dhcpReleaseDelay    300
#

# 
# If your router does not support DHCP on the LAN side, you can configure 
# CDRouter use its own internal DHCP server on the LAN. Any DHCP client that 
# CDRouter creates will automatically receive an IP address from an internal 
# server. NOTE: If this option is set to yes, any DHCP server related test 
# cases will not be executed.
#
# 
# testvar useInternalDHCP no
#
# By default, CDRouter will assign the router's LAN IP address as the
# DNS server address when using the internal DHCP server. This can be
# changed by configuring the testvar internalDHCPdns to a different DNS
# server. This should normally match the wanDnsServer testvar.
# 
# testvar internalDHCPdns 1.1.1.1
#
#

#
# WINS server configuration
#
# If you router is configured to provide a WINS server to DHCP clients on 
# the LAN interface, you may configure the winsServer1 and winsServer2
# testvars. If only one WINS server is supported, the winsServer2 
# entry should be commented out. 
#
# testvar winsServer1            3.3.3.4
# testvar winsServer2            3.3.3.5
#

#
# DHCP client extra parameters
#
# You can configure the CDRouter DHCP client to request extra DHCP options
# in the DHCP Option Parameter list. The testvar dhcpExtraClientParams can 
# be used to specify extra parameters. 
#
# Example, to add DHCP option 71
#
#   testvar dhcpExtraClientParams "71"
#   
# Example, to add DHCP options 69 and 70"
#
#   testvar dhcpExtraClientParams "69 70"
#

#
# DHCP server extra options
#
# You can configure the CDRouter DHCP server to provide extra DHCP options
# to the WAN DHCP client. Up to 255 additional DHCP options can be
# configured. Each DHCP option is configured using 2 testvar entries for
# the DHCP option code and raw hex data for the option. The DHCP option
# data must be converted into the raw ascii hex format. See the user's
# guide for more examples.
#
# Example, to add DHCP option 69 and DHCP option 71
#
# testvar dhcpServerOptionCode1  69
# testvar dhcpServerOptionData1  04040404
# testvar dhcpServerOptionCode2  71
# testvar dhcpServerOptionData2  0404040504040406
#



#
# -- PPPoE configuration
#

testvar pppoeConnectOnDemand  no
testvar pppoeUser             qacafe
testvar pppoePassword         qacafe123
testvar pppoeAcName           qacafe-ac

# -- PPPoE server name that will be used by the PPPoE server. Most routers
# will accept any service name. You can set this to 'any' to use PPPoE's
# concept of 'any' service.

testvar pppoeServiceName      qacafe

#
# -- PPPoA configuration
#

testvar pppoaUser             qacafe
testvar pppoaPassword         qacafe123
testvar pppoaConnectOnDemand  no

#
# -- PPP/T1 configuration
#

testvar pppUser               qacafe
testvar pppPassword           qacafe123
testvar pppConnectOnDemand    no



#
# -- PPTP configuration
#

testvar pptpUser              qacafe
testvar pptpPassword          qacafe123

#
# By default, CDRouter will use the wanIspIp address as the local address
# for the PPP connection created by PPTP. However, you can change the PPP
# connection to use a different subnet, by configuring the local Server IP
# and the client IP. If you are using a different subnet for the PPTP
# connection, you may need to update the the wanNatIp to be the same as the
# pptpClientIp.
#
#
# testvar pptpServerIp          192.168.3.1
# testvar pptpClientIp          192.168.3.2

#
# By default, PPTP requires static IP addressing for the initial IPv4
# configuration. However, you can also configure CDRouter to run a 
# DHCP server on the WAN interface for the PPTP client to learn its
# initial IPv4 address. To enable the DHCP on the WAN when running
# PPTP set the testvat pptpUseDHCP to yes.
#
# testvar pptpUseDHCP yes
#

#
# -- pppAuthType
#
#    Supported types are:
#       PAP
#       CHAP
#       MSCHAP
#       MSCHAPv2
#       None
#
testvar pppAuthType           PAP

#
# -- pppForceLcpMRU
#
# Set this option to force the LCP MRU to a specific value. By default,
# CDRouter will determine the MRU value based on the WAN protocol. This
# option should only be used as a work around for routers that can not
# negotiate the LCP MRU.
#
# testvar pppForceLcpMRU      1500

#
# --- pppMagicNumber
# 
# By default PPP includes the LCP Magic Number option. You can configure
# PPP not to use the LCP Magic Number option by setting the pppMagicNumber
# testvar to no.
#
# testvar pppMagicNumber no
#

#
# -- pppConnectionDelay
#
# Set this option to specify a delay in seconds to wait after a PPP session
# is established before the the PPP session is used. The default is 10
# seconds.
#
# testvar pppConnectionDelay 10
#

#
# -- DNS configuration
#
# DNStoDHCP
#
# Most routers relay the DNS server learned on the WAN side as a DHCP option
# to DHCP clients on the LAN. However, some routers only annouce the LAN
# side IP address as the DNS server and forward all DNS traffic to the WAN
# side DNS server.
#

testvar DNStoDHCP             yes

# -- NTP Configuration
#
# CDRouter can provide up to 2 NTP timeservers on the WAN interface. To 
# configure a NTP timeserver, use the ntpServer1 and ntpServer2 testvars 
# to configure an IP address for each server. The IP addresses should not be
# the same as any other network elements such as the remoteHostIp, or
# wanIspIp.
#
# The NTP servers can also be mapped to specific DNS names using the
# testvar ntpServerName1 and ntpServerName2 testvars.
# 
testvar ntpServer1           3.3.3.6
testvar ntpServerName1       time.nist.gov

testvar ntpServer2           3.3.3.7
testvar ntpServerName2       time.foo.com


#
# 802.1x/EAPOL authentication
#
# If you are running EAPOL on the lanInterface, configure lanUseEAPOL to yes.
# Otherwise, lanUseEAPOL should be set to no.

testvar lanUseEAPOL           no

#
# eapType
#
# Configure the EAP type to use. Supported eapTypes are:
#
#  eap-md5   
#  eap-tls
#  eap-ttls
#  eap-peap
#

testvar eapType               eap-md5

#
# eapDynamicWep
#
# To enable dynamic WEP behavior for those EAP types that send EAPOL-Key
# packets, configure eapDynamicWep to 'yes'. Otherwise, set to 'no'.
# 

testvar eapDynamicWep         no

#
# Configure one or more EAP identities and corresponding passwords (for 
# eap-md5, eap-ttls, eap-peap) or certificate information (for eal-tls). 
# Upto 8196 eap identities can be configured. For EAP-TLS you must also 
# configure a path name to the user certificate file, and private key. 
# The certificate and private key may live in the same file.
#
#    eap-md5    only requires the identity and password
#    eap-tls    only requires the identity and certificate information
#    eap-ttls   only requires the identity and password
#    eap-peap   only requires the identity and password
#
# 

testvar eapIdentity1            user1
testvar eapPassword1            qacafe123
testvar eapUserCertPath1        /usr/share/doc/cdrouter/user1.pem
testvar eapUserCertPassword1    qacafe123
testvar eapUserPrivateKey1      /usr/share/doc/cdrouter/user1.pem

testvar eapIdentity2            user2
testvar eapPassword2            pw123
testvar eapUserCertPath2        /usr/share/doc/cdrouter/user2.pem
testvar eapUserCertPassword2    qacafe123
testvar eapUserPrivateKey2      /usr/share/doc/cdrouter/user2.pem

#
# EAP releated timers and counters. These should not be changed unless they
# are known for the EAP implementation you are testing.
#

testvar eapTxWhen             60
testvar eapQuietPeriod        60
testvar eapReAuthMax          2
testvar eapSendLogoffFailure  yes

#
# The eapReAuthPeriod is the reauthentication interval for the 802.1x 
# authenticator. If not specified, the default is 3600 seconds. If set
# to 0, the reauthentication test will not be run. Depending on the 
# reauthentication interval supported on the authenticator, the
# reauthentication tests can take a long time to complete. Some devices
# allow this value to be configured.

testvar eapReAuthPeriod       0

#
# Additional 802.1x EAP-TLS configuration

testvar eapRootCert             /usr/share/doc/cdrouter/root.pem
testvar eapServerCertPath       /usr/share/doc/cdrouter/server.pem
testvar eapServerCertPassword   qacafe123
testvar eapFragmentSize         1024

#
# RADIUS configuration
#
# A built in RADIUS server for 802.1x/EAP authentication can be enabled.
# When the RADIUS server is enabled, it will run on the remoteHost address.
#
# On the device under test, you must configure the IP address for the 
# RADIUS server using the same IP address configured as the remoteHost 
# IP address.
#
# The RADIUS server will build its own user database based on the list
# of EAP identities and passwords defined in this configuration file.
#

testvar enableRADIUSserver    no
testvar radiusSecret          qacafe123

#
# RADIUS server extra atrributes
#
# You can configure the CDRouter RADIUS server to provide extra RADIUS 
# strributes to any RADIUS client. Up to 255 additional RADIUS attributes 
# can be configured. Each RADIUS attribute is configured using 2 testvar 
# entries for the RADIUS attribute type and raw hex data for the attribute. 
# The RADIUS attribute data must be converted into the raw ascii hex 
# format. See the user's guide for more examples.
#
# Example, to add RADIUS atrribute 200 and RADIUS attribute 201
#
# testvar radiusServerAddrType1  200
# testvar radiusServerAddrData1  04040404
# testvar radiusServerAddrType2  201
# testvar radiusServerAddrData2  0404040504040406
#

#
# -- IPSEC pass through supported
#
#  yes
#  no
#

testvar supportsIPSECpass     yes

#
# ipsecAddressType
#
# Most routers support IPSEC pass through using private addresses on the
# LAN interface. Normally, the ipsecAddressType should be set to 'private'.
# However, some routers require a DMZ type configuration where the public 
# IP address is used on the LAN side. In these cases, the ipsecAddressType
# should be set to 'public'.
#
# private     Private IP addres used on LAN side
# public      Public IP address used on LAN side (DMZ style)
#

testvar ipsecAddressType      private

#
# ipsecMaxTunnels
#
# The maximum number of IPSEC pass through tunnels that can be created

testvar ipsecMaxTunnels       20

#
# ipsecScaleSameServer    
#
# Set to yes if all IPSEC pass through connections in the scaling tests should
# attempt to use the same IP address as the IPSEC tunnel endpoint. If no, each
# IPSEC pass through connection will be made to a unique IP destination address.
#
testvar ipsecScaleSameServer  no    

#
# -- PPTP pass through supported
#
#  yes
#  no
#

testvar supportsPPTPpass      yes

#
# pptpMaxTunnels
#
# The maximum number of PPTP tunnels that can be created

testvar pptpMaxTunnels        20

#
# --- PPPoE pass through supported
#
#
 
testvar supportsPPPoEpass     no


#
# RIP supported
#
# yes
# no

testvar ripSupported          yes

#
# RIP version 1 or 2

testvar ripVersion            2

#
# RIP simple password authentication for RIPv2. If RIPv2 simple password
# authentication is enabled on the router, configure ripSimplePassword
# with the same text password to enable RIPv2 password authentication.
#
# testvar ripSimplePassword  qacafe123
#

#
# Max RIP routes
testvar ripMaxRoutes          96

#
# RIP Route Timeout
testvar ripRouteTimeout       180

#
# RIP GarbageTimeout          
testvar ripGarbageTimeout     120

#
# RIP Route Processing Delay
#
# This is the number of millseconds to wait before a route learned via RIP is installed
# in the router's routing table and ready to forward traffic. It defaults to 3 seconds
# (3 milliseconds).
#
testvar ripRouteDelay         3000

testvar swl_ripMetric            1
testvar swl_ripDampTime          30

# total route should be checked
testvar swl_ripRouteTotal        3
testvar swl_ripRouteDest1        0.0.0.0
testvar swl_ripRouteNhop1        0.0.0.0
testvar swl_ripRouteMask1        0.0.0.0
testvar swl_ripRouteDest2        192.168.168.0
testvar swl_ripRouteNhop2        0.0.0.0
testvar swl_ripRouteMask2        255.255.255.0
testvar swl_ripRouteDest3        192.168.222.0
testvar swl_ripRouteNhop3        0.0.0.0
testvar swl_ripRouteMask3        255.255.255.0

#
# Port Scan Tests

testvar portScanStart         0
testvar portScanStop          2048

#
# Port Scan Delay
#
# By default, CDRouter will only wait 1 millisecond between each scan
# probe. This delay can be increased by setting the testvar portScanDelay
# to a higher number. This will slow down the rate at which CDRouter
# sends scan probe packets.
#

testvar portScanDelay         1

#
# Non-Stealth Firewall Ports
#
# If your router is expected to close specific ports on the WAN, you may
# configure a list of closed ports. These ports will be verified during the
# port scanning tests. Some routers offer this service on port 113 and others.
#
# You may also configure a list of open ports on the router. If the port is
# being used for a virtual service, then the port should not be configured
# as an open port.
#
# testvar firewallTcpClosedPorts "2323"
# testvar firewallTcpOpenPorts "22 443"
#
# testvar firewallUdpClosedPorts "113"
# testvar firewallUdpOpenPorts "1234"
#

#
# FTP inbound port timeout
#
# This is the amount of time in seconds to wait before verifying that
# any inbound TCP ports opened by FTP have been closed by the router
# once the FTP control session is closed.
#

testvar ftpPortTimeout        80

#
# TCP MSS Clamping
#
# If the router supports MSS Clamping for TCP sessions, configure the 
# expected MSS size. If MSS is not supported or expected, comment out the
# testvar mssClampingValue.
# 
# You can also set the mssClampingValue to 'default'. CDRouter will
# automatically compute the expected MSS based on the lanMtu setting.
# If your MSS implementation sets the MSS different to handle other
# factors such as IP or IPSEC tunnels, you should configure the MSS to
# match your implementation.
#
# Example values:
#
#  PPPoE 1452
#  DHCP  1500
# 
testvar mssClampingValue      default


#
# HOP count
#
# Normally the IPv4HopCount is set to 1. However, if the 'wanMode' is set to
# 'static' the test suite can be used to test end-to-end through a network
# that contains additional IPv4 devices that change the hop count. The
# 'IPv4HopCount' value should be set to the expected number of hops between
# the LAN and WAN interfaces.

testvar IPv4HopCount           1


#
# static hosts entries
#
# Any static host address should be outside of the DHCP client address pool
# range. The cdrouter LAN side will respond to ARP requests for any IP
# address defined with a 'staticHost' entry. These entries are not normally used.
#

# testvar staticHost1           192.168.1.125
# testvar staticHost2           192.168.1.126


#
# -- maximum connections

testvar natMaxTcpConns        200
testvar natMaxUdpConns        100

#
# -- NAT implementation options

#
# -- If the NAT/firewall configuration supports simultaneous TCP open
#    configure the testvar natSimulataneousTcp to "yes". Otherwise,
#    configure this to "no".
#

testvar natSimultaneousTcp    no

#
# -- If the NAT implementation is Peer-to-Peer friendly (P2P), configure
#    the testvar natSupportsP2P to "yes". Otherwise, configure this to
#    "no". When set to yes, the NAT module will include tests for Cone
#    NAT and hairpin media translation.
#

testvar natSupportsP2P        yes


# -- NAT timers
#
# The Fin/Rst timeout for TCP sessions can be configured using the 
# natFinRstTimeout testvar. If not specified, the NAT Fin/Rst 
# related tests will be skipped. This timer is normally implementation 
# dependent although RFC 2663 recommends a default of 240 seconds 
# (4 minutes).
#
# testvar natFinRstTimeout    240
#
#
# testvar natTcpTimeout       86400
# 
# testvar natSynTimeout       90
#
# testvar natUdpTimeout       300
#
# testvar natDnsTimeout       300
#
# testvar natIcmpTimeout      120
#

#
# -- maximum TCP connections per DHCP host during the scaling tests
#

testvar scaleTcpConnsPerHost  5

#
# -- initial TCP/UDP port range
#
# Normally, CDRouter will select a new starting TCP/UDP port for TCP/UDP
# clients when the test run starts. However, it is possible to force a 
# specific starting port for test purposes. The starting port number must 
# be an integer from 1 to 65535.
#
# testvar tcpUdpPortStart 10000
#

#
# -- User configurable DNS entries
#
#  You may specify up to 10 hostname to IP address mappings that you
#  wish to have exist in all of CDRouter's DNS servers.
#
#  Each entry needs a dnsHostname<N> and cooresponding dnsIp<N>
#
#  Examples:
#
#  testvar dnsHostname1          test.qacafe.com
#  testvar dnsIp1                5.5.5.5
#
#  testvar dnsHostname2          foo.qacafe.com
#  testvar dnsIp2                5.5.5.6
#

#
# -- Internal SMTP server
#
#  If enabled, CDRouter has a built-in SMTP server able to receive mail and
#  display it during a test run.  If you need to receive emails from a device,
#  enable the Internal SMTP server. 
#
#testvar internalSmtpServer           5.5.5.5


#
# -- virtual TCP services
#
#   yes
#   no
#
# If set to 'yes' the cdrouter suite will test each virtual services configured
# using the virtualTcpService* entries below.
#

testvar virtualTcpServices            no

#
# -- virtual TCP services translation types
#
# virtualWANTransType is used to configure the expected NAT translation of the 
# IP source address for inbound packets that are using a virtual service. The 
# following values are accepted
#
#  none     - no translation of the IP source is done on incoming packets (Default)
#  public   - the IP source address is translated to router's WAN ip address
#  private  - the IP source address is translated to the router's LAN ip address   
#
# The default value is private.
#

testvar virtualWANTransType           none

# virtualLANTransType is used to configure the expected NAT translation of the 
# IP source address for packets originating on the LAN that are using a 
# virtual service. The following values are accepted
#
#  public   - the IP source address is translated to router's WAN ip address
#  private  - the IP source address is translated to the router's LAN ip address   
#
# The default value is public.
#

testvar virtualLANTransType           public



testvar virtualTcpServicePort1          21
testvar virtualTcpServiceHost1          192.168.1.200
testvar virtualTcpServiceName1          ftp

#
# For each virtual TCP and UDP service, you may specify a different port 
# number on the LAN. By default, the port number on the LAN is the same as 
# the WAN and does not need to be configured.
#
# testvar virtualTcpServiceLanPort1   876
#

testvar virtualTcpServicePort2        23
testvar virtualTcpServiceHost2        192.168.1.201
testvar virtualTcpServiceName2        telnet


testvar virtualTcpServicePort3        25
testvar virtualTcpServiceHost3        192.168.1.202
testvar virtualTcpServiceName3        smtp


testvar virtualTcpServicePort4        79
testvar virtualTcpServiceHost4        192.168.1.205
testvar virtualTcpServiceName4        finger


#
# -- virtual UDP services
#
#   yes
#   no
#
# If set to 'yes' the cdrouter suite will test each virtual services configured
# using the virtualUdpService* entries below.
#

testvar virtualUdpServices            no

testvar virtualUdpServicePort1        53
testvar virtualUdpServiceHost1        192.168.1.203
testvar virtualUdpServiceName1        dns

testvar virtualUdpServicePort2        69
testvar virtualUdpServiceHost2        192.168.1.204
testvar virtualUdpServiceName2        tftp

testvar virtualUdpServicePort3        161
testvar virtualUdpServiceHost3        192.168.1.209
testvar virtualUdpServiceName3        snmp

#
# -- Special Application Port Triggers

testvar portTriggers                  no

#
# -- Timeout for port triggers
#
# This timeout is the number of seconds the router will wait before closing
# an inbound port mapping that has been idle. If the router does not close
# inbound port mappings after they are created, set this value to 0.
#

testvar portTriggerTimeout            0

#
# -- Port Trigger Delay
#
# A delay can be added between the verification of each port trigger. The
# delay is configured in milliseconds.
#
# testvar portTriggerDelay            0
#
#

#
# -- net2phone example
#
# any outbound udp session to port 6801 should open up port 30000 for
# both UDP and TCP
#

testvar triggerName1                  net2phone-1
testvar triggerPort1                  6801
testvar triggerType1                  udp
testvar triggerPublic1                30000
testvar triggerPublicType1            both

testvar triggerName2                  GNUtelle
testvar triggerPort2                  6346
testvar triggerType2                  tcp
testvar triggerPublic2                6346
testvar triggerPublicType2            udp

testvar triggerName3                  QuickTime-4-Server
testvar triggerPort3                  6970
testvar triggerType3                  tcp
testvar triggerPublic3                6970-7000
testvar triggerPublicType3            udp


#
# -- H.323 ALG support (NetMeeting)

testvar supportsH323AlgOutbound       no
testvar supportsH323AlgInbound        no

# -- inboundH323Host
#
# This is the IP address of a host on the LAN that should receive any incoming
# H.323 calls. This host will use a static IP configuration. This address should
# not conflict with the DHCP address range.

testvar inboundH323Host       192.168.1.220

#
# -- MSN Messenger ALG support

testvar supportsMsnAlg        no

#
# Non-standard MSN server ports may be configured for the Notification
# server and the SwitchBoard server. The default is port 1863.
#
# testvar msnNotificationServerPort 1863
# testvar msnSwitchBoardServerPort 1863
#


#
# -- RTSP ALG support

testvar supportsRtspAlg       no

#
# The testvar rtspTeardownDelay can be used to adjust the amount of time between the 
# RTSP TEARDOWN and the verification of the port mappings. It defaults to 5 seconds.
#
# testvar rtspTeardownDelay   5
#


#
# -- URL filtering

testvar urlFilterSupported    no
testvar filtered-urls         "http://abc.com/yahoo.htm http://www.foo.com/home.htm"
testvar non-filtered-urls     "http://qacafe.com"

#
# -- UPnP

testvar upnpSupported         yes

#
# -- UPnP WANPPPConnection
#
# If the router uses the WANPPPConnection service instead of the 
# WANIPConnection service, configure the upnpWANPPPConnnection testvar
# to yes.
#
# testvar upnpWANPPPConnection yes

#
# -- UPnP LANDevice
#
# If the router supports the LANDevice service template, configure the
# upnpLANDevice testvar to yes.
#
testvar upnpLANDevice no

#
# -- The maximum number of UPnP port mappings to test

testvar upnpMaxTcpMappings    10

#
# -- The port ranges that will be used for all UPnP tests. These port ranges
# should not conflict with any other static port mappings on the router such
# as virtual services or port triggers. The range should contain at
# least the maximum number of ports that are supported with the
# upnpMaxTcpMappings configured above.

testvar upnpPortStart         40000
testvar upnpPortStop          50000

#
# -- DMZ configuration

#
# A DMZ host on the LAN side of the router can be configured using the 
# lanDmzHost entry below. If the router does not have a DMZ host configured,
# no lanDmzHost entry should be configured. When the DMZ host is configured,
# the firewall tests will no longer run.
#
# testvar lanDmzHost            192.168.1.253

#
# An optional MAC address may be defined for the DMZ host. If not defined,
# a default MAC address is assigned.
#
# testvar lanDmzHostMac         00:00:23:01:02:03

#
# You can configure exceptions for certain TCP or UDP ports that do not 
# have DMZ behavior. These routers may have been configured to reject or 
# drop certain ports regardless of the DMZ configuration.
# 
# testvar lanDmzTcpPortExceptions 113
# testvar lanDmzUdpPortExceptions 1234
#

#
# If the router does not support ICMP packets getting forwarded to the DMZ
# host, the lanDmzSupportsIcmp option can be set to no. Otherwise, it 
# defaults to yes.
#
testvar lanDmzSupportsIcmp no
#

#
# -- Multicast Support
#
testvar supportsMulticast yes

#
# -- Multicast Type
#
# The multicastType testvar can be used to select the type of multicast
# implementation. This should be either:
#
# proxy
# passthrough
#

testvar multicastType proxy

#
# -- Multicast Router Alert Option
#
# By default, the IGMPv2 and greater client will send IGMP packets with
# the IP Router Alert IP Option. This may be disabled by configuring the
# igmpRouterOption testvar to no.
#
testvar igmpRouterOption yes

#
# -- Maximum IGMP Groups
#
# Maximum number of IGMP groups that are supported on the LAN interface

testvar igmpMaxGroups 200

#
# -- Multicast Cache Timeout
#
# The multicastCacheTimeout is used to specify a delay after a host 
# leaves a group before forwarding should stop. Some devices implement
# a cache function that allows packets to be forwarded for a few seconds
# after the last host leaves a multicast group.

testvar multicastCacheTimeout 10

#
# -- Free Multicast Addresses to use for multicast testing

testvar multicastPoolStart    224.0.1.0
testvar multicastPoolStop     239.255.255.255

#
# -- IPSEC tunnel configuration

#
# Multiple IPSEC tunnels can be defined to correspond with IPSEC tunnels
# that have been created on the device under test. There are several testvar
# variables that must be configured for each tunnel. Each entry ends with
# the tunnel number such as 1, 2, 3, etc.

#
# ipsecTunnelEndpoint<N>       This is the IP address for the IPSEC tunnel endpoint
#
# ipsecTunnelRemoteNetwork<N>  This is the network address of the remote network 
#                              from the perspective of the router under test.
#
# ipsecTunnelRemoteMask<N>     This is the network mask of the remote network
#                              from the perspective of the router under test.
#
# ipsecTunnelHost<N>           This is an IP address within the tunnels network
#                              address space. CDRouter will create a reachable
#                              host through the tunnel at this IP address.
#
# ipsecTunnelOutboundSpi<N>    This is the SPI number for the outbound SPI. This
#                              must match the inbound SPI configured on the device.
#                              Values can be entered in decimal of hex starting 
#                              with 0x. For example 1000 or 0x3e8. 
#
# ipsecTunnelOutEncrypt<N>     This is the encryption type for the outbound SA.
#                              This may be 3des, des, or null.
#
# ipsecTunnelOutEncryptKey<N>  This is the key for the specified encryption type.
#
# ipsecTunnelOutAuth<N>        This is authentication type for the outbound SA.
#                              This may be md5-hmac, sha-hmac, or null.
#
# ipsecTunnelOutAuthKey<N>     This is the key for the specified authentication 
#                              type.
#
# ipsecTunnelInboundSpi<N>     This is the SPI number for the inbound SPI. This
#                              must match the outbound SPI configured on the device.
#                              Values can be entered in decimal of hex starting 
#                              with 0x. For example 1001 or 0x3e9. 
#
# ipsecTunnelInEncrypt<N>      This is the encryption type for the inbound SA.
#                              This may be 3des, des, or null.
#
# ipsecTunnelInEncryptKey<N>   This is the key for the specified encryption type.
#
# ipsecTunnelInAuth<N>         This is authentication type for the inbound SA.
#                              This may be md5-hmac, sha-hmac, or null.
#
# ipsecTunnelInAuthKey<N>      This is the key for the specified authentication 
#                              type.


# Example IPSEC tunnel 1

# testvar ipsecTunnelEndpoint1          5.0.0.1
# testvar ipsecTunnelRemoteNetwork1     5.0.0.0
# testvar ipsecTunnelRemoteMask1        255.255.255.0
# testvar ipsecTunnelHost1              5.0.0.2
# testvar ipsecTunnelOutboundSpi1       1000
# testvar ipsecTunnelOutEncrypt1        des
# testvar ipsecTunnelOutEncryptKey1     0102030405060708
# testvar ipsecTunnelOutAuth1           md5-hmac
# testvar ipsecTunnelOutAuthKey1        6262626262626262
# testvar ipsecTunnelInboundSpi1        1001
# testvar ipsecTunnelInEncrypt1         des
# testvar ipsecTunnelInEncryptKey1      0102030405060708
# testvar ipsecTunnelInAuth1            md5-hmac
# testvar ipsecTunnelInAuthKey1         6262626262626262
#

# Example IPSEC tunnel 2

# testvar ipsecTunnelEndpoint2          6.0.0.1
# testvar ipsecTunnelRemoteNetwork2     6.0.0.0
# testvar ipsecTunnelRemoteMask2        255.255.255.0
# testvar ipsecTunnelHost2              6.0.0.2
# testvar ipsecTunnelOutboundSpi2       1002
# testvar ipsecTunnelOutEncrypt2        des
# testvar ipsecTunnelOutEncryptKey2     0102030405060708
# testvar ipsecTunnelOutAuth2           null
# testvar ipsecTunnelOutAuthKey2        6262626262626262
# testvar ipsecTunnelInboundSpi2        1003
# testvar ipsecTunnelInEncrypt2         des
# testvar ipsecTunnelInEncryptKey2      0102030405060708
# testvar ipsecTunnelInAuth2            null
# testvar ipsecTunnelInAuthKey2         6262626262626262
#

#
# -- remote host IP address
#
# The 'remoteHostIp' address is an address on the WAN side of the network
# that will be used for verification of LAN->WAN traffic and WAN->LAN traffic.
# This address should not conflict with the free network address ranges
# list below.
#
testvar remoteHostIp          3.3.3.3

#
# -- Free network addresses to use during the test

testvar FreeNetworkStart      192.168.201.0
testvar FreeNetworkMask       255.255.255.0
testvar FreeNetworkStop       193.0.0.0

#
# -- Test Suite start-up delay
#
# The startDelay is the amount of time the test suite will wait after the
# LAN and WAN interfaces have been established. 
#

testvar startDelay            5

#
# LAN start delay
#
# The lanStartDelay is the amount of time to wait after the WAN side
# connection has been established before starting DHCP clients on the LAN. 
# This option is not used when the WAN is configured with connect-on-demand.
#
testvar lanStartDelay         5

#
# Close the WAN connection on exit
#
# When 'wanCloseOnExit' is set to yes, the PPP connection for PPPoE or PPPoA
# will be closed when the test run has completed. Any DHCP client leases on
# the LAN will also be released.
#
# testvar wanCloseOnExit        yes


#
# COMMANDS
#

